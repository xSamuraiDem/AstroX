<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VortexPay // Terminal Core</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090e;--bg-sub:#0c1017;--card:#101520;--card-border:#1c2738;--card-hover:#162030;
  --tx:#d8e2ec;--tx-dim:#5b6e85;--tx-bright:#f0f6fc;
  --neon-cyan:#00e5ff;--neon-green:#00ff66;--neon-purple:#bd93f9;--neon-gold:#ffd166;--neon-red:#ff5555;
  --glow-cyan:0 0 14px rgba(0,229,255,0.45);--glow-green:0 0 14px rgba(0,255,102,0.45);
  --font-mono:'JetBrains Mono',monospace;--font-tech:'Orbitron',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
body{
  font:13px/1.5 var(--font-mono);background:var(--bg);color:var(--tx);
  overflow-x:hidden;min-height:100vh;
  background-image:radial-gradient(ellipse at 50% -20%,rgba(0,229,255,0.08),transparent 70%),
                   linear-gradient(to bottom,rgba(255,255,255,0.015) 1px,transparent 1px),
                   linear-gradient(to right,rgba(255,255,255,0.015) 1px,transparent 1px);
  background-size:100% 100%, 28px 28px, 28px 28px;
}
/* Scanlines */
body::after{content:"";position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;background:linear-gradient(rgba(18,16,16,0) 50%,rgba(0,0,0,0.25) 50%);background-size:100% 4px;z-index:9999;opacity:0.6}
button,input,select,textarea{font:inherit;color:inherit}a{cursor:pointer;text-decoration:none;color:inherit}

/* Top Nav / IDE Tab bar */
.topbar{position:sticky;top:0;z-index:100;background:rgba(7,9,14,0.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--card-border)}
.sysline{display:flex;align-items:center;justify-content:space-between;padding:4px 14px;background:#05070a;border-bottom:1px solid rgba(255,255,255,0.05);font-size:10px;color:var(--tx-dim);letter-spacing:1px}
.nav{display:flex;align-items:center;gap:4px;padding:6px 14px;overflow-x:auto}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--font-tech);font-size:15px;color:var(--tx-bright);background:none;border:none;cursor:pointer;margin-right:12px}
.logo-tag{background:var(--neon-cyan);color:#000;font-weight:900;padding:1px 5px;border-radius:2px;font-size:11px}
.nav-tab{padding:6px 10px;border-radius:4px;border:1px solid transparent;color:var(--tx-dim);font-size:12px;display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;transition:0.2s}
.nav-tab:hover{color:var(--tx);background:rgba(255,255,255,0.02)}
.nav-tab.active{background:var(--card);border-color:var(--card-border);color:var(--neon-cyan);box-shadow:0 0 10px rgba(0,229,255,0.1)}
.nav-tab.go-tab{border-color:rgba(255,209,102,0.3);color:var(--neon-gold);background:rgba(255,209,102,0.05)}
.nav-tab.go-tab.active{background:rgba(255,209,102,0.15);box-shadow:0 0 12px rgba(255,209,102,0.3)}

.user-badge{margin-left:auto;display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 10px;border-radius:4px;background:var(--card);border:1px solid var(--card-border)}
.user-badge:hover{border-color:var(--neon-cyan)}
.avatar-cli{width:24px;height:24px;border-radius:3px;background:var(--neon-cyan);color:#000;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;overflow:hidden}
.avatar-cli img{width:100%;height:100%;object-fit:cover}

/* Main Container */
main{max-width:1120px;margin:0 auto;padding:20px 14px 80px}
.term-box{background:var(--card);border:1px solid var(--card-border);border-radius:6px;margin-bottom:14px;position:relative;overflow:hidden}
.term-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg-sub);border-bottom:1px solid var(--card-border);font-size:11px;color:var(--tx-dim);letter-spacing:0.5px}
.term-body{padding:14px}
.mac-dots{display:flex;gap:5px}.mac-dot{width:9px;height:9px;border-radius:50%;background:#ff5f56}.mac-dot:nth-child(2){background:#ffbd2e}.mac-dot:nth-child(3){background:#27c93f}

/* Typography & Badges */
.pt{font-family:var(--font-tech);font-size:22px;color:var(--tx-bright);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.code-inline{background:rgba(0,229,255,0.08);color:var(--neon-cyan);padding:2px 6px;border-radius:3px;border:1px solid rgba(0,229,255,0.2);font-size:11.5px}
.tag{font-size:10px;padding:2px 6px;border-radius:2px;font-weight:700;display:inline-flex;align-items:center;gap:4px;text-transform:uppercase}
.tag-cyan{background:rgba(0,229,255,0.15);color:var(--neon-cyan);border:1px solid rgba(0,229,255,0.3)}
.tag-green{background:rgba(0,255,102,0.15);color:var(--neon-green);border:1px solid rgba(0,255,102,0.3)}
.tag-gold{background:rgba(255,209,102,0.18);color:var(--neon-gold);border:1px solid rgba(255,209,102,0.4)}
.tag-red{background:rgba(255,85,85,0.15);color:var(--neon-red);border:1px solid rgba(255,85,85,0.3)}

/* Buttons & Inputs */
.btn{background:var(--card);border:1px solid var(--card-border);color:var(--tx-bright);padding:8px 14px;border-radius:4px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-weight:600;transition:0.2s}
.btn:hover{border-color:var(--neon-cyan);background:var(--card-hover);color:var(--neon-cyan)}
.btn-cyan{background:var(--neon-cyan);color:#000;border:1px solid var(--neon-cyan);box-shadow:var(--glow-cyan);font-weight:700}
.btn-cyan:hover{background:#38ecff;color:#000}
.btn-gold{background:var(--neon-gold);color:#000;border:1px solid var(--neon-gold);box-shadow:0 0 14px rgba(255,209,102,0.45);font-weight:700}
.btn-gold:hover{background:#ffe08a;color:#000}
.btn-danger{border-color:var(--neon-red);color:var(--neon-red)}
.btn-danger:hover{background:rgba(255,85,85,0.15)}
.btn:disabled{opacity:0.4;cursor:not-allowed;border-color:var(--card-border);color:var(--tx-dim);box-shadow:none}

.inp,select,textarea{width:100%;background:var(--bg-sub);border:1px solid var(--card-border);border-radius:4px;padding:9px 12px;color:var(--tx-bright);outline:none;transition:0.2s}
.inp:focus,select:focus,textarea:focus{border-color:var(--neon-cyan);box-shadow:0 0 8px rgba(0,229,255,0.25)}

/* GO Subscription & Quotas Widget */
.go-banner{
  background:linear-gradient(135deg,#121722,#1d1a10);
  border:1px solid rgba(255,209,102,0.4);border-radius:6px;padding:18px;position:relative;margin-bottom:18px;
  box-shadow:0 0 25px rgba(255,209,102,0.08);
}
.go-banner::before{content:"PREMIUM // GO";position:absolute;top:6px;right:10px;font-size:9px;color:var(--neon-gold);letter-spacing:2px;font-weight:800}
.quota-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:14px 0}
.quota-cell{background:var(--bg);border:1px solid var(--card-border);border-radius:4px;padding:12px;position:relative}
.quota-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:11px;color:var(--tx-dim)}
.quota-val{font-size:18px;font-weight:800;color:var(--tx-bright);font-family:var(--font-tech)}
.quota-bar{height:5px;background:var(--bg-sub);border-radius:2px;margin-top:8px;overflow:hidden;border:1px solid rgba(255,255,255,0.05)}
.quota-fill{height:100%;background:var(--neon-cyan);border-radius:2px;transition:width 0.3s}
.quota-fill.gold{background:var(--neon-gold)}

/* Interactive Help Tooltip (?) */
.q-mark{
  display:inline-flex;align-items:center;justify-content:center;
  width:16px;height:16px;border-radius:50%;background:rgba(255,209,102,0.15);
  color:var(--neon-gold);font-weight:800;font-size:11px;cursor:pointer;
  position:relative;border:1px solid rgba(255,209,102,0.4);
}
.q-mark:hover .q-tip{opacity:1;visibility:visible;transform:translateY(0)}
.q-tip{
  position:absolute;bottom:calc(100% + 8px);right:-10px;width:260px;
  background:#0c1017;border:1px solid var(--neon-gold);box-shadow:0 0 16px rgba(0,0,0,0.8);
  padding:10px 12px;border-radius:4px;font-size:11px;line-height:1.45;color:var(--tx);
  opacity:0;visibility:hidden;transform:translateY(6px);transition:0.2s;z-index:999;
  text-transform:none;font-weight:normal;pointer-events:none;
}
.q-tip::after{content:"";position:absolute;top:100%;right:13px;border:5px solid transparent;border-top-color:var(--neon-gold)}

/* Products list */
.prod-row{display:grid;grid-template-columns:200px 1fr 100px 140px;gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--card-border);transition:0.15s;cursor:pointer}
.prod-row:hover{background:var(--card-hover)}
.prod-row:last-child{border-bottom:none}
@media(max-width:768px){
  .prod-row{grid-template-columns:1fr;gap:6px}
}

/* CLI Mini Console */
.cli-box{background:#040608;border:1px solid var(--card-border);border-radius:4px;padding:10px 12px;font-size:12px;color:var(--neon-green);margin-top:14px}
.cli-log{max-height:120px;overflow-y:auto;margin-bottom:8px;font-size:11.5px;color:var(--tx-dim)}
.cli-log div{margin-bottom:3px}
.cli-input-line{display:flex;align-items:center;gap:8px}
.cli-prompt{color:var(--neon-cyan);font-weight:700}
.cli-input{background:transparent;border:none;color:var(--neon-green);outline:none;width:100%;font-family:var(--font-mono)}

/* Bottom Status Bar */
.statusbar{position:fixed;bottom:0;left:0;right:0;background:#05070a;border-top:1px solid var(--card-border);padding:4px 12px;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--tx-dim);z-index:100}

/* Toast */
.toast{position:fixed;bottom:42px;left:50%;transform:translateX(-50%);background:#0c1017;border:1px solid var(--neon-cyan);box-shadow:var(--glow-cyan);color:var(--neon-cyan);padding:8px 16px;border-radius:4px;font-size:12px;opacity:0;pointer-events:none;transition:0.25s;z-index:9999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
</style>
</head>
<body>

<div class="topbar">
  <div class="sysline">
    <div>VORTEX_NET // P2P PROTOCOL v2.4</div>
    <div id="pingLine">PING: 24ms | STATUS: CONNECTED</div>
  </div>
  <div class="nav">
    <button class="logo" id="logoBtn"><span class="logo-tag">VTX</span> VORTEX<span>PAY</span></button>
    <div class="nav-tab active" data-v="market"><span>[01]</span> Каталог</div>
    <div class="nav-tab go-tab" data-v="go"><span>⚡</span> ПОДПИСКА GO</div>
    <div class="nav-tab" data-v="purchases"><span>[02]</span> Сделки</div>
    <div class="nav-tab" data-v="sales"><span>[03]</span> Продажи</div>
    <div class="nav-tab" data-v="messages"><span>[04]</span> Терминал/Чат</div>
    <div class="nav-tab" data-v="support"><span>[05]</span> Поддержка</div>
    <div class="user-badge" id="userBadge">
      <div class="avatar-cli" id="cliAvatar">V</div>
      <span id="cliNick" style="font-size:11.5px;font-weight:600">user</span>
      <span class="tag tag-cyan" id="cliTier">FREE</span>
    </div>
  </div>
</div>

<main id="mainView"></main>

<div class="statusbar">
  <div><span style="color:var(--neon-green)">●</span> VORTEX_DAEMON_OK | REQ_TODAY: <span id="statReq" style="color:var(--tx-bright)">0/25</span></div>
  <div id="statExpire">TIER: FREE</div>
</div>

<div class="toast" id="toast"></div>

<script>
const DB="https://tetete-d31c8-default-rtdb.firebaseio.com", ADMIN="8515868917", TTL=30;
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand()}
const tu=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user, uid=tu?String(tu.id):null;
const $=i=>document.getElementById(i);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function fb(p,m="GET",b,q=""){
  const o={method:m};
  if(b!==undefined){o.headers={"Content-Type":"application/json"};o.body=JSON.stringify(b)}
  const r=await fetch(`${DB}/${p}.json${q}`,o);
  if(!r.ok)throw Error("HTTP "+r.status);
  return r.json();
}

function toast(t){
  const e=$("toast");e.textContent="> "+t;e.classList.add("show");
  clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2800);
}

const rub=n=>Number(n).toLocaleString("ru-RU",{minimumFractionDigits:2,maximumFractionDigits:2})+" ₽";
const dt=t=>new Date(t).toLocaleString("ru-RU",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});

let me={};
let quotaData={dayUsed:12,dayMax:25,weekUsed:45,weekMax:150,monthUsed:180,monthMax:600,expiresTs:0,isGo:false};

// Инициализация квот пользователя
function updateQuotasFromProfile(p){
  const now=Date.now();
  const subUntil=p.sub_go_until||0;
  const isGo=subUntil>now;
  quotaData.isGo=isGo;
  quotaData.expiresTs=subUntil;
  if(isGo){
    quotaData.dayMax=250;
    quotaData.weekMax=1500;
    quotaData.monthMax=6000;
  } else {
    quotaData.dayMax=25;
    quotaData.weekMax=150;
    quotaData.monthMax=600;
  }
  $("cliTier").textContent=isGo?"GO":"FREE";
  $("cliTier").className=isGo?"tag tag-gold":"tag tag-cyan";
  $("statReq").textContent=`${quotaData.dayUsed}/${quotaData.dayMax}`;
  if(isGo){
    const dLeft=Math.ceil((subUntil-now)/(86400000));
    $("statExpire").innerHTML=`TIER: <b style="color:var(--neon-gold)">GO</b> (истекает через ${dLeft} дн.)`;
  } else {
    $("statExpire").textContent="TIER: FREE (25 req/day)";
  }
}

async function cmd(name,args){
  const r=await fb("cmds","POST",{initData:tg?tg.initData:"",cmd:name,args,ts:Date.now()});
  for(let i=0;i<12;i++){
    await sleep(800);
    const x=await fb("cmd_res/"+r.name);
    if(x){fb("cmd_res/"+r.name,"DELETE");return x}
  }
  return{ok:false,msg:"Таймаут шлюза бота"};
}

// Покупка подписки GO через Telegram Stars Invoice
async function buyGoSubscription(){
  if(!uid)return toast("Ошибка сессии: откройте WebApp в боте");
  toast("Генерация Telegram Stars инвойса на 150 ⭐️...");
  try{
    await fb("invoice_links/"+uid,"DELETE");
    await fb("invoices/"+uid,"PUT",{stars:150,type:"sub_go",ts:Date.now()});
    let d=null;const end=Date.now()+14000;
    while(Date.now()<end){
      d=await fb("invoice_links/"+uid);
      if(d&&(d.url||d.error))break;
      await sleep(1000);
    }
    if(!d||d.error)throw Error(d?d.error:"Бот не сгенерировал ссылку на оплату");
    if(tg&&tg.openInvoice){
      tg.openInvoice(d.url,async status=>{
        if(status==="paid"){
          toast("Оплата подтверждена! Активируем GO...");
          await sleep(1500);
          await loadUser();
          go("go");
        } else {
          toast("Оплата отменена или не завершена");
        }
      });
    } else {
      window.open(d.url,"_blank");
    }
  }catch(e){
    toast("ERR: "+e.message);
  }
}

// Загрузка пользователя
async function loadUser(){
  if(!uid)return;
  const p=(await fb("profiles/"+uid).catch(()=>null))||{};
  me=p;
  $("cliNick").textContent=p.nick||p.first_name||`id_${uid.slice(-4)}`;
  if(p.avatar||p.tg_avatar){
    $("cliAvatar").innerHTML=`<img src="${p.avatar||p.tg_avatar}">`;
  }
  updateQuotasFromProfile(p);
}

// Роутинг видов
const V={};
function go(view,arg){
  document.querySelectorAll(".nav-tab").forEach(t=>t.classList.toggle("active",t.dataset.v===view));
  window.scrollTo(0,0);
  $("mainView").innerHTML='<div style="padding:40px;text-align:center;color:var(--tx-dim)">[FETCHING_DATA...]</div>';
  (V[view]||V.market)(arg).catch(e=>{
    $("mainView").innerHTML=`<div class="term-box"><div class="term-body" style="color:var(--neon-red)">ERR_VIEW_CRASH: ${esc(e.message)}</div></div>`;
  });
}

document.querySelectorAll(".nav-tab").forEach(t=>t.onclick=()=>go(t.dataset.v));
$("logoBtn").onclick=()=>go("market");
$("userBadge").onclick=()=>go("go");

// ----------------- ВИД: GO SUBSCRIPTION & КВОТЫ -----------------
V.go=async()=>{
  const now=Date.now();
  const isGo=quotaData.isGo;
  const expTs=quotaData.expiresTs;

  let expireString="—";
  let timeLeftString="Подписка не активна";
  if(isGo&&expTs>now){
    const d=new Date(expTs);
    expireString=`${d.toLocaleDateString("ru-RU")} ${d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})} UTC`;
    const diffHours=Math.max(0,Math.floor((expTs-now)/(3600000)));
    const days=Math.floor(diffHours/24);
    const hours=diffHours%24;
    timeLeftString=`Осталось: ${days} дн. ${hours} ч.`;
  }

  $("mainView").innerHTML=`
    <div class="pt"><span style="color:var(--neon-gold)">⚡</span> ТАРИФ И СИСТЕМА ЛИМИТОВ // GO</div>

    <div class="go-banner">
      <div style="font-family:var(--font-tech);font-size:24px;color:var(--neon-gold);margin-bottom:6px">VORTEX GO // DEVELOPER TIER</div>
      <p style="color:var(--tx-dim);max-width:680px;margin-bottom:14px;font-size:12.5px">
        Специальный тарифный план для активных трейдеров и разработчиков. Повышает суточный лимит запросов в 10 раз, снимает задержки очереди, открывает команды терминала и дает статус [GO] в профиле.
      </p>

      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <div style="font-size:22px;font-weight:800;color:var(--tx-bright);font-family:var(--font-tech)">150 ⭐️ <span style="font-size:12px;color:var(--tx-dim);font-family:var(--font-mono)">/ месяц</span></div>
        <button class="btn btn-gold" id="btnBuyGo">${isGo?"⚡ ПРОДЛИТЬ ПОДПИСКУ GO":"⚡ ОФОРМИТЬ ПОДПИСКУ GO"}</button>
        ${isGo?'<span class="tag tag-green">АКТИВНА</span>':'<span class="tag tag-cyan">БАЗОВЫЙ ДОСТУП</span>'}
      </div>
    </div>

    <!-- МЕНЕДЖЕР КВОТ И ЛИМИТОВ -->
    <div class="term-box">
      <div class="term-header">
        <div class="mac-dots"><div class="mac-dot"></div><div class="mac-dot"></div><div class="mac-dot"></div></div>
        <div>QUOTA_MONITOR // VORTEX_API</div>
        <div style="display:flex;align-items:center;gap:6px">
          <span>СПРАВКА О ЛИМИТАХ</span>
          <div class="q-mark">?
            <div class="q-tip">
              <b>Пояснение системы лимитов:</b><br><br>
              • <b>Лимит в день:</b> сбрасывается ежедневно в 00:00 UTC. С подпиской GO вам доступно <b>250 запросов</b> в день (вместо 25 на базовом).<br>
              • <b>Лимит в неделю:</b> 1,500 запросов.<br>
              • <b>Лимит в месяц:</b> 6,000 запросов.<br>
              • При исчерпании лимита API отвечает статусом 429 Too Many Requests до момента сброса.
            </div>
          </div>
        </div>
      </div>
      <div class="term-body">
        
        <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px;flex-wrap:wrap;gap:8px">
          <div>
            <div style="font-size:11px;color:var(--tx-dim)">ТЕКУЩИЙ СТАТУС ПОДПИСКИ</div>
            <div style="font-size:15px;font-weight:700;color:${isGo?'var(--neon-gold)':'var(--neon-cyan)'}">
              ${isGo?'⚡ ПОДПИСКА GO АКТИВИРОВАНА':'БАЗОВЫЙ ПЛАН (FREE)'}
            </div>
          </div>
          <div style="text-align:right">
            <div style="font-size:11px;color:var(--tx-dim)">СРОК ДЕЙСТВИЯ: ДО СКОЛЬКИ ИСТЕКАЕТ</div>
            <div style="font-size:13px;font-weight:600;color:var(--tx-bright)">
              ${expireString} <span style="color:var(--tx-dim);font-size:11px">(${timeLeftString})</span>
            </div>
          </div>
        </div>

        <div class="quota-grid">
          <div class="quota-cell">
            <div class="quota-header">
              <span>ЛИМИТ В ДЕНЬ</span>
              <span class="code-inline">${quotaData.dayUsed} / ${quotaData.dayMax} req</span>
            </div>
            <div class="quota-val">${quotaData.dayMax} <span style="font-size:11px;color:var(--tx-dim)">макс/сутки</span></div>
            <div class="quota-bar">
              <div class="quota-fill ${isGo?'gold':''}" style="width:${(quotaData.dayUsed/quotaData.dayMax)*100}%"></div>
            </div>
            <div style="font-size:10px;color:var(--tx-dim);margin-top:6px">Сброс: 00:00 UTC</div>
          </div>

          <div class="quota-cell">
            <div class="quota-header">
              <span>ЛИМИТ В НЕДЕЛЮ</span>
              <span class="code-inline">${quotaData.weekUsed} / ${quotaData.weekMax} req</span>
            </div>
            <div class="quota-val">${quotaData.weekMax} <span style="font-size:11px;color:var(--tx-dim)">макс/нед</span></div>
            <div class="quota-bar">
              <div class="quota-fill ${isGo?'gold':''}" style="width:${(quotaData.weekUsed/quotaData.weekMax)*100}%"></div>
            </div>
            <div style="font-size:10px;color:var(--tx-dim);margin-top:6px">Сброс: каждый пн.</div>
          </div>

          <div class="quota-cell">
            <div class="quota-header">
              <span>ЛИМИТ В МЕСЯЦ</span>
              <span class="code-inline">${quotaData.monthUsed} / ${quotaData.monthMax} req</span>
            </div>
            <div class="quota-val">${quotaData.monthMax} <span style="font-size:11px;color:var(--tx-dim)">макс/мес</span></div>
            <div class="quota-bar">
              <div class="quota-fill ${isGo?'gold':''}" style="width:${(quotaData.monthUsed/quotaData.monthMax)*100}%"></div>
            </div>
            <div style="font-size:10px;color:var(--tx-dim);margin-top:6px">Скользящее окно 30 дн.</div>
          </div>
        </div>

        <!-- ТЕРМИНАЛ КОМАНД CLI -->
        <div style="font-size:12px;font-weight:700;margin-top:16px;color:var(--tx-bright);display:flex;align-items:center;gap:6px">
          <span>КОДЕРСКИЙ ТЕРМИНАЛ // CLI</span>
          <span class="tag tag-cyan">SHELL</span>
        </div>
        <div class="cli-box">
          <div class="cli-log" id="cliOutput">
            <div>[VTX-CLI v2.4 initialized. Type 'help' to inspect commands.]</div>
            <div>[Current tier: ${isGo?'GO (Unrestricted)':'FREE'}. Daily limit: ${quotaData.dayMax}]</div>
          </div>
          <div class="cli-input-line">
            <span class="cli-prompt">vortex@user:~$</span>
            <input type="text" class="cli-input" id="cliCmdInput" placeholder="bump-all, ping, quotas, tier, help..." autocomplete="off">
          </div>
        </div>

      </div>
    </div>
  `;

  $("btnBuyGo").onclick=buyGoSubscription;

  // Обработка CLI команд
  const cmdInp=$("cliCmdInput");
  const logOut=$("cliOutput");
  cmdInp.onkeydown=async e=>{
    if(e.key==="Enter"){
      const raw=cmdInp.value.trim();
      if(!raw)return;
      cmdInp.value="";
      const line=document.createElement("div");
      line.innerHTML=`<span style="color:var(--neon-cyan)">vortex@user:~$</span> ${esc(raw)}`;
      logOut.appendChild(line);

      const parts=raw.split(" ");
      const c=parts[0].toLowerCase();
      let resText="";

      if(c==="help"){
        resText="Доступные команды:<br>• <b>bump-all</b> — поднять все свои лоты без кулдауна (требует GO)<br>• <b>quotas</b> — статус лимитов в день/неделю/месяц<br>• <b>tier</b> — статус подписки GO<br>• <b>ping</b> — задержка шлюза<br>• <b>clear</b> — очистить консоль";
      } else if(c==="ping"){
        resText="PONG: 21ms (P2P Cluster #4 Online)";
      } else if(c==="quotas"){
        resText=`Лимиты: ${quotaData.dayUsed}/${quotaData.dayMax} в день | ${quotaData.weekUsed}/${quotaData.weekMax} в нед | ${quotaData.monthUsed}/${quotaData.monthMax} в мес`;
      } else if(c==="tier"){
        resText=quotaData.isGo?`Статус: GO TIER активен до ${expireString}`:"Статус: FREE TIER (150 ⭐️/мес для апгрейда)";
      } else if(c==="clear"){
        logOut.innerHTML="";
        return;
      } else if(c==="bump-all"){
        if(!quotaData.isGo){
          resText="<span style='color:var(--neon-red)'>ACCESS_DENIED:</span> Команда 'bump-all' доступна только для пользователей подписки GO!";
        } else {
          resText="Выполняю пакетный подъем всех товаров...";
          const r=await cmd("cli_bump_all",{});
          resText=r.ok?`<span style='color:var(--neon-green)'>SUCCESS:</span> ${esc(r.msg)}`:`<span style='color:var(--neon-red)'>FAIL:</span> ${esc(r.msg)}`;
        }
      } else {
        resText=`Команда не распознана: '${esc(c)}'. Введите 'help'.`;
      }

      const resLine=document.createElement("div");
      resLine.innerHTML=`> ${resText}`;
      logOut.appendChild(resLine);
      logOut.scrollTop=logOut.scrollHeight;
    }
  };
};

// ----------------- ВИД: ТОВАР -----------------
V.offer=async(id)=>{
  const p=await fb("products/"+id);
  if(!p)return toast("Товар не найден");
  $("mainView").innerHTML=`
    <a class="btn" style="margin-bottom:12px" onclick="go('market')">← НАЗАД В КАТАЛОГ</a>
    <div class="term-box">
      <div class="term-header">
        <div>ITEM_ID: ${esc(p.id)}</div>
        <div class="tag tag-cyan">${esc(p.category)}</div>
      </div>
      <div class="term-body">
        <h2 style="font-size:20px;color:var(--tx-bright);margin-bottom:8px">${esc(p.titleRu||p.titleEn)}</h2>
        <div style="font-size:24px;font-weight:800;color:var(--neon-cyan);margin-bottom:14px">${rub(p.price)}</div>
        <div style="background:var(--bg-sub);border:1px solid var(--card-border);padding:12px;border-radius:4px;margin-bottom:14px;white-space:pre-wrap;color:var(--tx)">${esc(p.descRu||p.descEn)}</div>
        <button class="btn btn-cyan" style="padding:10px 20px" id="btnBuyItem">КУПИТЬ (P2P ESCROW)</button>
      </div>
    </div>
  `;
  $("btnBuyItem").onclick=async()=>{
    if(p.owner===uid)return toast("Нельзя купить свой собственный товар");
    toast("Оформление сделки...");
    const o={id:"O"+Math.random().toString(36).slice(2,8).toUpperCase(),code:Math.random().toString(36).slice(2,8).toUpperCase(),productId:id,title:p.titleRu||p.titleEn,price:p.price,buyerId:uid,buyerName:me.nick||me.first_name,sellerId:p.owner,sellerName:p.sellerName,status:"pending",created:Date.now()};
    await fb("orders/"+o.id,"PUT",o);
    toast("Сделка создана!");
    go("purchases");
  };
};

// ----------------- ВИД: ПРОДАЖИ -----------------
V.sales=async()=>{
  const prods=Object.values((await fb("products").catch(()=>null))||{}).filter(p=>p.owner===uid);
  $("mainView").innerHTML=`
    <div class="pt"><span style="color:var(--neon-cyan)">[//]</span> ПАНЕЛЬ ПРОДАВЦА</div>
    <div class="term-box">
      <div class="term-header">
        <div>МОИ ЛОТЫ (${prods.length})</div>
        <button class="btn btn-cyan" style="padding:4px 8px;font-size:11px" id="btnAddLot">+ НОВЫЙ ЛОТ</button>
      </div>
      <div class="term-body" id="lotFormContainer"></div>
      <div class="term-body">
        ${prods.map(p=>`
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--card-border)">
            <div><b>${esc(p.titleRu)}</b> <span style="color:var(--tx-dim)">(${esc(p.category)})</span></div>
            <div style="display:flex;gap:6px">
              <span style="font-weight:700;color:var(--neon-cyan)">${rub(p.price)}</span>
              <button class="btn btn-danger" style="padding:2px 8px;font-size:10px" onclick="deleteProduct('${p.id}')">DEL</button>
            </div>
          </div>
        `).join("")||'<div style="color:var(--tx-dim)">У вас нет выставленных товаров.</div>'}
      </div>
    </div>
  `;

  $("btnAddLot").onclick=()=>{
    $("lotFormContainer").innerHTML=`
      <div style="background:var(--bg-sub);padding:12px;border:1px solid var(--card-border);border-radius:4px;margin-bottom:12px">
        <div style="font-weight:700;margin-bottom:8px;color:var(--neon-cyan)">> СОЗДАНИЕ НОВОГО ЛОТА</div>
        <input class="inp" id="nlTitle" placeholder="Название товара" style="margin-bottom:8px">
        <textarea class="inp" id="nlDesc" placeholder="Описание" style="margin-bottom:8px;min-height:60px"></textarea>
        <div style="display:flex;gap:8px;margin-bottom:8px">
          <input class="inp" id="nlPrice" type="number" placeholder="Цена (руб)">
          <select class="inp" id="nlCat"><option>Игры</option><option>Roblox</option><option>Подписки</option><option>Аккаунты</option></select>
        </div>
        <button class="btn btn-cyan" id="nlSave">СОХРАНИТЬ ЛОТ</button>
      </div>
    `;
    $("nlSave").onclick=async()=>{
      const title=$("nlTitle").value.trim();
      const price=Number($("nlPrice").value);
      if(!title||price<=0)return toast("Заполните корректно название и цену");
      const id="P"+Math.random().toString(36).slice(2,8).toUpperCase();
      await fb("products/"+id,"PUT",{
        id,owner:uid,sellerName:me.nick||me.first_name,
        titleRu:title,titleEn:title,descRu:$("nlDesc").value.trim(),
        price,category:$("nlCat").value,created:Date.now(),bumpAt:Date.now()
      });
      toast("Лот опубликован!");
      go("sales");
    };
  };
};

window.deleteProduct=async(id)=>{
  if(!confirm("Удалить лот?"))return;
  await fb("products/"+id,"DELETE");
  toast("Лот удален");
  go("sales");
};

// ----------------- ВИД: ПОДДЕРЖКА & ТИКЕТЫ -----------------
V.support=async()=>{
  const tickets=Object.values((await fb("user_tickets/"+uid).catch(()=>null))||{});
  $("mainView").innerHTML=`
    <div class="pt"><span style="color:var(--neon-cyan)">[//]</span> СЛУЖБА ПОДДЕРЖКИ // TICKETS</div>
    <div class="term-box">
      <div class="term-header">
        <div>СОЗДАТЬ ТИКЕТ В ТЕХОТДЕЛ</div>
      </div>
      <div class="term-body">
        <select class="inp" id="tTopic" style="margin-bottom:8px">
          <option>Подписка GO / Квоты</option>
          <option>Вопрос по оплате / финансам</option>
          <option>Проблема с заказом</option>
          <option>Другое</option>
        </select>
        <textarea class="inp" id="tText" placeholder="Подробно опишите суть проблемы или вопроса (минимум 10 символов)..." style="min-height:80px;margin-bottom:8px"></textarea>
        <button class="btn btn-cyan" id="tSend">ОТПРАВИТЬ ТИКЕТ</button>
      </div>
    </div>

    <div class="term-box">
      <div class="term-header"><div>МОИ ОБРАЩЕНИЯ (${tickets.length})</div></div>
      <div class="term-body">
        ${tickets.map(t=>`
          <div style="padding:10px 0;border-bottom:1px solid var(--card-border)">
            <div style="display:flex;justify-content:space-between">
              <b>#${t.id} · ${esc(t.topic)}</b>
              <span class="tag tag-cyan">${esc(t.status)}</span>
            </div>
            <div style="color:var(--tx-dim);font-size:12px;margin:4px 0">${esc(t.text)}</div>
            ${t.solution?`<div style="color:var(--neon-green);font-size:11.5px">> Ответ инженера: ${esc(t.solution)}</div>`:''}
          </div>
        `).join("")||'<div style="color:var(--tx-dim)">У вас нет активных тикетов.</div>'}
      </div>
    </div>
  `;

  $("tSend").onclick=async()=>{
    const text=$("tText").value.trim();
    if(text.length<10)return toast("Минимум 10 символов в описании");
    $("tSend").disabled=true;
    toast("Отправка тикета в шину...");
    const r=await cmd("ticket_new",{topic:$("tTopic").value,text,role:"buyer"});
    if(r.ok){
      toast("Тикет зарегистрирован!");
      go("support");
    } else {
      toast("ERR: "+r.msg);
      $("tSend").disabled=false;
    }
  };
};
