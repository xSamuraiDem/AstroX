<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#212121;--side:#171717;--surf:#2f2f2f;--surf2:#292929;--line:rgba(255,255,255,.1);--text:#ececec;--muted:#9b9b9b;--red:#ef4444;--red-d:#b91c1c;--ok:#10a37f;--body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:400 15px/1.55 var(--body);color:var(--text);background:var(--bg);min-height:100vh;overflow-x:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
body.lock{overflow:hidden}
::selection{background:var(--red);color:#fff}
.screen{display:none;max-width:520px;margin:0 auto;min-height:100vh;padding:26px 18px 36px;flex-direction:column;gap:16px}
.screen.active{display:flex;animation:fade .3s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}}
h1{font:600 28px/1.15 var(--body);letter-spacing:-.02em}h2{font:600 17px/1.2 var(--body)}h3.sec{font:600 13px var(--body);color:var(--muted);margin-top:6px}
.sub{color:var(--muted)}b{font-weight:600}.clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;background:var(--red);color:#fff;font:600 15px var(--body);padding:13px 18px;border-radius:14px;cursor:pointer;transition:background .15s,transform .08s}
.btn:hover{background:#dc2626}.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}.btn.ghost:hover{background:var(--surf)}
.btn.sm{width:auto;padding:8px 14px;font-size:13px;border-radius:999px}
.btn:disabled{background:var(--surf);color:#6b6b6b;cursor:not-allowed}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.box,.tile{background:var(--surf2);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.tag{display:inline-flex;align-items:center;font:500 12px var(--body);padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.ok{color:#34d399;border-color:rgba(16,163,127,.5);background:rgba(16,163,127,.12)}.tag.no{color:#f87171;border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.12)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px}.kv>span:first-child{color:var(--muted)}
.steps{display:flex;gap:6px}.steps i{flex:1;height:4px;border-radius:9px;background:var(--surf)}.steps i.on{background:var(--red)}
code{font:500 13px ui-monospace,Menlo,Consolas,monospace;background:var(--surf);border-radius:6px;padding:2px 6px;color:#fca5a5}
input.in,textarea{width:100%;font:400 15px var(--body);color:var(--text);background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
input.in:focus,textarea:focus{outline:0;border-color:var(--red)}textarea{min-height:92px;resize:vertical}.count{text-align:right;font-size:12px;color:var(--muted)}.row{display:flex;gap:10px}
label.l{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
/* welcome */
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px}
.logo{width:52px;height:52px;border-radius:16px;background:var(--red);position:relative;flex:none}.logo::after{content:"";position:absolute;inset:15px;border-radius:50%;border:4px solid #fff}
.lang{display:flex;background:var(--surf2);border:1px solid var(--line);border-radius:14px;padding:4px}.lang button{flex:1;border:0;background:none;color:var(--muted);font:600 14px var(--body);padding:10px;border-radius:10px;cursor:pointer}.lang button.on{background:var(--surf);color:var(--text)}
/* policy */
.pbar{height:4px;background:var(--surf);border-radius:9px;overflow:hidden}.pbar i{display:block;height:100%;width:0;background:var(--red);transition:width .12s}
.policy{height:46vh;overflow-y:auto;border:1px solid var(--line);border-radius:18px;background:var(--surf2);padding:16px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.policy h2{font-size:14px}.policy p{font-size:14px;color:#c9c9c9}
.chk{display:flex;gap:12px;align-items:flex-start;cursor:pointer;padding:12px;border:1px solid var(--line);border-radius:14px;transition:opacity .2s}.chk input{width:20px;height:20px;accent-color:var(--red);flex:none;margin-top:2px}.chk.off{opacity:.4;pointer-events:none}
/* otp */
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.otp input{min-width:0;width:100%;height:58px;text-align:center;font:600 24px var(--body);color:var(--text);background:var(--surf);border:1px solid var(--line);border-radius:14px;caret-color:var(--red)}
.otp input::placeholder{color:#555}.otp input:not(:placeholder-shown){border-color:var(--red)}.otp input:focus{outline:0;border-color:var(--red);box-shadow:0 0 0 3px rgba(239,68,68,.25)}
.otp.bad input{border-color:var(--red);animation:sh .3s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.msg{min-height:22px;color:#f87171;font-weight:500}.hint{border:1px dashed var(--line);border-radius:14px;padding:12px;color:var(--muted)}
/* connect */
.stat{display:flex;align-items:center;gap:14px;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--surf2)}.stat.on{border-color:rgba(16,163,127,.6)}.stat.off{border-color:rgba(239,68,68,.6)}
.dot{width:14px;height:14px;border-radius:50%;background:var(--red);flex:none}.stat.on .dot{background:var(--ok);animation:pulse 1.6s infinite}.stat.off .dot{animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.25}}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,163,127,.6)}100%{box-shadow:0 0 0 12px transparent}}
ol.how{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px;color:#c9c9c9}ol.how li{counter-increment:s;display:flex;gap:12px;align-items:flex-start}
ol.how li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surf);font:600 12px var(--body)}
.plan header{display:flex;justify-content:space-between;align-items:center;gap:10px}.plan.free{border-color:var(--red)}.plan.go{opacity:.75;border-style:dashed}
/* avatars */
.avatar{position:relative;width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--surf) center/cover no-repeat;color:#fff;font:600 18px var(--body);display:grid;place-items:center;cursor:pointer;padding:0}
.avatar.sm{width:36px;height:36px;font-size:15px}.avatar.big{width:84px;height:84px;font-size:32px;cursor:default}
.avatar.live::after{content:"";position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--bg)}
.me{display:flex;gap:16px;align-items:center}.me .avatar{width:76px;height:76px;font-size:28px;cursor:default}
/* app shell (ChatGPT-like) */
#s-main{max-width:none;padding:0;gap:0}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(33,33,33,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.ib{width:40px;height:40px;border:0;background:transparent;color:var(--text);border-radius:10px;font-size:20px;cursor:pointer}.ib:hover{background:var(--surf)}
.ttl{flex:1;font-weight:600;font-size:16px;padding-left:4px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:290px;max-width:84vw;background:var(--side);transform:translateX(-100%);transition:transform .25s;z-index:31;padding:16px 10px;display:flex;flex-direction:column;gap:6px}.drawer.open{transform:none}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 14px}.brand .logo{width:34px;height:34px;border-radius:10px}.brand .logo::after{inset:9px;border-width:3px}
.nv{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;background:none;color:var(--text);font:500 15px var(--body);border-radius:12px;cursor:pointer;text-align:left}.nv:hover,.nv.on{background:var(--surf)}.nv i{font-style:normal;width:22px;text-align:center}
main{width:100%;max-width:720px;margin:0 auto;padding:20px 14px 120px}
.view{display:none;flex-direction:column;gap:14px}.view.active{display:flex;animation:fade .25s ease}
.hi{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:10px 0 6px}.hi h1{font-size:26px}.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px}
details.cmd{background:var(--surf2);border:1px solid var(--line);border-radius:18px}
details.cmd summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:14px 16px}details.cmd summary::-webkit-details-marker{display:none}
details.cmd summary::after{content:"⌄";margin-left:auto;color:var(--muted);transition:transform .2s}details.cmd[open] summary::after{transform:rotate(180deg)}
details.cmd .ex{padding:0 16px 14px;color:var(--muted)}details.cmd summary span{color:var(--muted);font-size:14px}
details.box summary{cursor:pointer;font-weight:600;list-style:none}details.box summary::-webkit-details-marker{display:none}
.cmdrow{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--line)}.cmdrow:last-of-type{border:0}
.item{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;color:var(--text);font:inherit;background:var(--surf2);border:1px solid var(--line);border-radius:16px;padding:13px 15px;cursor:pointer}.item:hover{background:var(--surf)}div.item{cursor:default}div.item:hover{background:var(--surf2)}
.tabs{display:flex;gap:6px;background:var(--surf2);padding:4px;border-radius:14px;border:1px solid var(--line)}.tabs button{flex:1;border:0;background:none;color:var(--muted);font:600 13px var(--body);padding:9px;border-radius:10px;cursor:pointer}.tabs button.on{background:var(--surf);color:var(--text)}
.msgs{display:flex;flex-direction:column;gap:12px}.b{max-width:86%;align-self:flex-start;padding:10px 14px;border-radius:18px;line-height:1.5;word-break:break-word}
.b.me{align-self:flex-end;background:var(--surf)}.b small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.b img,.th img{display:block;max-width:100%;border-radius:12px;margin-top:8px}
.dock{position:fixed;left:0;right:0;bottom:0;padding:24px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 45%);z-index:15}
.pill{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line);border-radius:28px;padding:6px 6px 6px 18px;color:var(--muted);cursor:pointer;width:100%;font:inherit;text-align:left}
.pill input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:400 15px var(--body);padding:10px 0}.pill input:focus{outline:0}
.pill b,.pill button{margin-left:auto;width:36px;height:36px;border-radius:50%;border:0;background:var(--text);color:#111;font-size:18px;display:grid;place-items:center;cursor:pointer}
.th{position:relative;display:inline-block;width:84px;margin:6px 6px 0 0}.th img{height:84px;object-fit:cover;margin:0}.th button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;cursor:pointer}
[hidden]{display:none!important}
/* modals */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;z-index:60}.modal.open{display:flex}
.sheet{width:100%;max-width:520px;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow-y:auto;animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(10px);background:var(--text);color:#111;padding:10px 18px;border-radius:999px;font:600 14px var(--body);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:70;max-width:90vw;text-align:center}.toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- 1. Welcome -->
<section class="screen active" id="s-welcome">
  <div class="hero"><div class="logo"></div><h1 data-i="wTitle"></h1><p class="sub" data-i="wSub"></p></div>
  <div class="lang"><button data-lang="ru">RU</button><button data-lang="en">EN</button></div>
  <button class="btn" id="b-start" data-i="start"></button>
</section>

<!-- 2. Privacy policy (must be read to the end) -->
<section class="screen" id="s-policy">
  <div class="steps" data-step="1"></div>
  <h1 data-i="pTitle"></h1>
  <div class="pbar"><i id="pfill"></i></div>
  <div class="policy" id="policy"></div>
  <p class="sub" id="p-hint" data-i="pHint"></p>
  <label class="chk off" id="chk"><input type="checkbox" id="agree"><span data-i="pAgree"></span></label>
  <button class="btn" id="b-policy" disabled data-i="pAccept"></button>
</section>

<!-- 3. Registration / 2FA -->
<section class="screen" id="s-verify">
  <div class="steps" data-step="2"></div>
  <h1 data-i="vTitle"></h1>
  <div class="box"><div class="me"><div class="avatar tg-av"></div><div><h2 class="tg-name"></h2><div class="sub tg-un"></div><div class="sub tg-id"></div></div></div></div>
  <p class="sub" data-i="vSub"></p>
  <div class="hint" data-i="vHint"></div>
  <div class="otp" id="otp"></div><div class="msg" id="o-msg" role="alert"></div>
  <button class="btn" id="b-verify" data-i="verify"></button>
</section>

<!-- 4. Business connection -->
<section class="screen" id="s-connect">
  <div class="steps" data-step="3"></div>
  <h1 data-i="cTitle"></h1>
  <div class="stat off" id="biz"><div class="dot"></div><div><h2 id="biz-t"></h2><div class="sub" id="biz-s"></div></div></div>
  <div class="box"><h2 data-i="cHow"></h2><ol class="how" id="how"></ol></div>
  <button class="btn ghost" id="b-check" data-i="check"></button>
  <button class="btn" id="b-connected" disabled data-i="cont"></button>
</section>

<!-- 5. Plans -->
<section class="screen" id="s-plans">
  <div class="steps" data-step="4"></div>
  <h1 data-i="plTitle"></h1>
  <div class="box plan free"><header><h2>Free</h2><span class="tag ok" data-i="avail"></span></header><p class="sub" data-i="freeD"></p><button class="btn" id="b-free" data-i="chooseFree"></button></div>
  <div class="box plan go"><header><h2>Plan GO</h2><span class="tag" data-i="soon"></span></header><p class="sub" data-i="goD"></p><button class="btn" disabled data-i="inDev"></button></div>
</section>

<!-- 6. App shell: ChatGPT-style sidebar + views -->
<section class="screen" id="s-main">
  <header class="bar">
    <button class="ib" id="b-menu" aria-label="Menu">☰</button>
    <div class="ttl" id="v-title">Mini App</div>
    <button class="btn ghost sm" id="b-help" data-i="help"></button>
    <button class="avatar sm tg-av" id="av-top" aria-label="Profile"></button>
  </header>
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer"><div class="brand"><div class="logo"></div><b>Mini App</b></div><nav id="nav"></nav></aside>
  <main>
    <div class="view active" id="v-home">
      <div class="hi"><div class="avatar big tg-av"></div><h1 class="tg-name"></h1><p class="sub tg-un"></p>
        <div class="chips"><span class="tag" id="m-biz"></span><span class="tag ok">Free</span><span class="tag tg-id"></span></div></div>
      <h3 class="sec" data-i="cmds"></h3>
      <details class="cmd"><summary><code>!help</code><span data-i="c1"></span></summary><div class="ex" data-i="c1x"></div></details>
      <details class="cmd"><summary><code>!mute</code><span data-i="c2"></span></summary><div class="ex" data-i="c2x"></div></details>
      <details class="cmd"><summary><code>!unmute</code><span data-i="c3"></span></summary><div class="ex" data-i="c3x"></div></details>
      <div class="box"><span class="sub" data-i="about"></span><p id="m-desc"></p></div>
      <div class="dock"><button class="pill" data-nav="support"><span data-i="askSupport"></span><b>↑</b></button></div>
    </div>
    <div class="view" id="v-support">
      <button class="btn" id="b-newt" data-i="newT"></button>
      <div class="box" id="t-form" hidden>
        <div><label class="l" for="t-nick" data-i="yourNick"></label><input class="in" id="t-nick" maxlength="40"></div>
        <div><label class="l" for="t-text" data-i="problem"></label><textarea id="t-text" maxlength="1000"></textarea></div>
        <div id="t-prev"></div><input type="file" id="t-file" accept="image/*" multiple hidden>
        <button class="btn ghost" id="t-att" data-i="attach"></button>
        <div class="row"><button class="btn ghost" id="t-cancel" data-i="cancel"></button><button class="btn" id="t-send" data-i="send"></button></div>
      </div>
      <h3 class="sec" data-i="myT"></h3><div class="view active" id="t-list" style="gap:10px"></div>
    </div>
    <div class="view" id="v-thread">
      <div class="box" id="th-head"></div><div class="msgs" id="th-msgs"></div><div class="row" id="th-act"></div>
      <div class="dock" id="th-dock"><div class="pill"><input id="th-in" maxlength="1000" data-ph="writeMsg"><button id="th-send" aria-label="Send">↑</button></div></div>
    </div>
    <div class="view" id="v-queue">
      <div class="tabs" id="q-tabs"><button data-q="open" data-i="st_open"></button><button data-q="work" data-i="st_work"></button><button data-q="closed" data-i="st_closed"></button></div>
      <div class="view active" id="q-list" style="gap:10px"></div>
    </div>
    <div class="view" id="v-admin">
      <details class="box" open><summary>🎧 Поддержка</summary>
        <div class="row"><input class="in" id="a-sid" inputmode="numeric" placeholder="Telegram ID"><button class="btn sm" id="a-sadd">Назначить</button></div><div id="a-slist" style="display:flex;flex-direction:column;gap:8px"></div></details>
      <details class="box"><summary>⛔ Баны</summary>
        <input class="in" id="a-bid" inputmode="numeric" placeholder="Telegram ID"><input class="in" id="a-bt" placeholder="Время: 30m, 2h, 7d (пусто = навсегда)"><input class="in" id="a-br" placeholder="Причина">
        <button class="btn" id="a-bban">Забанить</button><div id="a-blist" style="display:flex;flex-direction:column;gap:8px"></div></details>
      <details class="box"><summary>📨 Апелляции</summary><div id="a-ap" style="display:flex;flex-direction:column;gap:8px"></div></details>
    </div>
  </main>
</section>

<!-- Ban screen + appeal -->
<section class="screen" id="s-ban">
  <div class="logo"></div><h1 data-i="banT"></h1>
  <div class="box"><div class="kv"><span data-i="banReason"></span><b id="ban-reason"></b></div><div class="kv"><span data-i="banUntil"></span><b id="ban-until"></b></div></div>
  <h2 data-i="appeal"></h2>
  <textarea id="ap-text" maxlength="600" data-ph="appealPh"></textarea>
  <div id="ap-st"></div>
  <button class="btn" id="ap-send" data-i="appealSend"></button>
</section>

<!-- Help modal -->
<div class="modal" id="m-help"><div class="sheet" role="dialog" aria-modal="true">
  <h2 data-i="help"></h2>
  <div class="box"><div class="cmdrow"><code>!help</code><span class="sub" data-i="c1"></span></div><div class="cmdrow"><code>!mute [время] [причина]</code><span class="sub" data-i="c2"></span></div><div class="cmdrow"><code>!unmute</code><span class="sub" data-i="c3"></span></div></div>
  <p class="sub" data-i="helpNote"></p>
  <button class="btn" data-close data-i="close"></button>
</div></div>

<!-- Profile modal -->
<div class="modal" id="m-prof"><div class="sheet" role="dialog" aria-modal="true">
  <h2 data-i="profile"></h2>
  <div class="me"><div class="avatar tg-av" id="av-big"></div><div><h2 class="tg-name"></h2><div class="sub tg-un"></div></div></div>
  <button class="btn ghost" id="b-photo" data-i="photo"></button><input type="file" id="file" accept="image/*" hidden>
  <div class="box">
    <div class="kv"><span>ID</span><b class="tg-id2"></b></div>
    <div class="kv"><span data-i="langLbl"></span><b id="pf-lang"></b></div>
    <div class="kv"><span>Premium</span><b id="pf-prem"></b></div>
    <div class="kv"><span data-i="status"></span><span class="tag ok">Free</span></div>
    <div class="kv"><span data-i="bizLbl"></span><span class="tag" id="pf-biz"></span></div>
  </div>
  <div><label class="sub" for="desc" data-i="about"></label><textarea id="desc" maxlength="200"></textarea><div class="count"><span id="cnt">0</span>/200</div></div>
  <div class="row"><button class="btn ghost" data-close data-i="close"></button><button class="btn" id="b-save" data-i="save"></button></div>
</div></div>
<div class="toast" id="toast"></div>

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

let lang = "ru"; try { lang = localStorage.getItem("lang") || (U.language_code === "en" ? "en" : "ru"); } catch {}

let rec = { description:"", avatar:"", plan:"", policyAt:0 }, bizOn = false, current = "s-welcome";

function applyLang(){
  setTimeout(() => $$("[data-ph]").forEach(e => e.placeholder = t(e.dataset.ph)));
  document.documentElement.lang = lang;
  $$("[data-i]").forEach(e => e.innerHTML = t(e.dataset.i));
  $$(".lang button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
  $("#policy").innerHTML = t("policy").map(([h, p]) => `<h2>${h}</h2><p>${p}</p>`).join("");
  $("#how").innerHTML = [1,2,3,4].map(n => `<li>${t("h"+n).replace("@BOT","@"+BOT_USERNAME)}</li>`).join("");
  $$(".steps").forEach(s => s.innerHTML = [1,2,3,4].map(n => `<i class="${n <= s.dataset.step ? "on" : ""}"></i>`).join(""));
  $("#pf-lang").textContent = lang.toUpperCase(); $("#pf-prem").textContent = U.is_premium ? t("yes") : t("no");
  $("#m-desc").textContent = rec.description || t("emptyD"); paintBiz(); paintMe();
}
$$(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.lang; try { localStorage.setItem("lang", lang); } catch {} applyLang(); });

/* ── Telegram identity everywhere (avatar = custom one, else Telegram photo, else initial) ── */
function paintMe(){
  const src = rec.avatar || U.photo_url || "";
  $$(".tg-av").forEach(el => { el.style.backgroundImage = src ? `url("${src}")` : ""; el.textContent = src ? "" : (U.first_name || "?")[0].toUpperCase(); });
  $$(".tg-name").forEach(e => e.textContent = fullName);
  $$(".tg-un").forEach(e => e.textContent = U.username ? "@" + U.username : "—");
  $$(".tg-id").forEach(e => e.textContent = "ID " + uid); $$(".tg-id2").forEach(e => e.textContent = uid);
}
function paintBiz(){
  const s = $("#biz"); s.className = "stat " + (bizOn ? "on" : "off");
  $("#biz-t").textContent = t(bizOn ? "on" : "off"); $("#biz-s").textContent = t(bizOn ? "onS" : "offS");
  $("#b-connected").disabled = !bizOn; $("#av-top").classList.toggle("live", bizOn);
  for (const id of ["#m-biz", "#pf-biz"]) { const e = $(id); e.textContent = t(bizOn ? "on" : "off"); e.className = "tag " + (bizOn ? "ok" : "no"); }
}
let toastT; function toast(m){ const e = $("#toast"); e.textContent = m; e.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove("show"), 1900); }

/* ── Routing: policy → registration code → business → plan → dashboard ── */
let poll;
function show(id){
  current = id; clearInterval(poll);
  $$(".screen").forEach(s => s.classList.toggle("active", s.id === id)); scrollTo(0, 0);
  if (id === "s-connect"){ checkBiz(); poll = setInterval(checkBiz, 3000); }   // live status
  if (id === "s-policy") setTimeout(policyScroll, 50);
  if (id === "s-verify") cells[0].focus();
}
const verified = () => { try { return sessionStorage.getItem("v") === uid; } catch { return false; } };
function next(){
  if (ban && !isAdmin) return showBan();
  if (!rec.policyAt) return show("s-policy");
  if (!verified()) return show("s-verify");
  if (!bizOn) return show("s-connect");
  if (rec.plan !== "free") return show("s-plans");
  enterApp();
}
async function loadRec(){
  await loadAccess();
  try { const s = await tmo(get(ref(db, `users/${uid}`))); if (s.exists()) rec = { ...rec, ...s.val() }; } catch (e) { console.error(e); }
  try { bizOn = !!(await tmo(get(ref(db, `business/${uid}/connected`)))).val(); } catch {}
}
async function checkBiz(){
  try { bizOn = !!(await tmo(get(ref(db, `business/${uid}/connected`)), 6000)).val(); } catch {}
  paintBiz();
}

/* ── 1 → 2: welcome and policy (must scroll to the bottom) ── */
$("#b-start").onclick = async () => { $("#b-start").disabled = true; await loadRec(); $("#b-start").disabled = false; next(); };
const pol = $("#policy"); let read = false;
function policyScroll(){
  $("#pfill").style.width = Math.min(100, pol.scrollTop / Math.max(1, pol.scrollHeight - pol.clientHeight) * 100) + "%";
  if (!read && pol.scrollTop + pol.clientHeight >= pol.scrollHeight - 6){
    read = true; $("#chk").classList.remove("off"); $("#p-hint").style.visibility = "hidden";
  }
}
pol.addEventListener("scroll", policyScroll);
$("#agree").onchange = e => $("#b-policy").disabled = !(e.target.checked && read);
$("#b-policy").onclick = async () => {
  const b = $("#b-policy"); b.disabled = true;
  try {
    await tmo(update(ref(db, `users/${uid}`), { tgId: uid, name: fullName, username: U.username || "", premium: !!U.is_premium, photo: U.photo_url || "", lang, policyAt: Date.now(), registeredAt: rec.registeredAt || Date.now() }));
    rec.policyAt = Date.now(); next();
  } catch (e) { console.error(e); toast(t("eNet")); b.disabled = false; }
};

/* ── 3: 6-digit code ── */
const otp = $("#otp"), cells = [];
for (let i = 0; i < 6; i++){
  const c = document.createElement("input"); c.inputMode = "numeric"; c.placeholder = "·"; c.maxLength = 1; c.autocomplete = i ? "off" : "one-time-code";
  c.setAttribute("aria-label", "Digit " + (i + 1));
  c.oninput = () => { c.value = c.value.replace(/\D/g, ""); if (c.value && cells[i+1]) cells[i+1].focus(); if (cells.every(x => x.value)) verify(); };
  c.onkeydown = e => { if (e.key === "Backspace" && !c.value && i) cells[i-1].focus(); };
  c.onfocus = () => c.select();
  c.onpaste = e => { const d = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 6); if (!d) return; e.preventDefault(); cells.forEach((x, j) => x.value = d[j] || ""); if (d.length === 6) verify(); };
  cells.push(c); otp.append(c);
}
let busy = false, tries = 0, lockUntil = 0;
async function verify(){
  if (busy) return; const m = $("#o-msg"); m.textContent = "";
  const fail = k => { m.textContent = t(k); otp.classList.add("bad"); setTimeout(() => otp.classList.remove("bad"), 400); cells.forEach(x => x.value = ""); cells[0].focus(); };
  const w = Math.ceil((lockUntil - Date.now()) / 1000);
  if (w > 0){ fail("eLock"); m.textContent += ` ${w}s`; return; }
  const code = cells.map(x => x.value).join(""); if (code.length < 6) return fail("eFmt");
  busy = true; $("#b-verify").disabled = true;
  try {
    const d = (await tmo(get(ref(db, `codes/${uid}`)))).val();
    if (!d) return fail("eNone");
    if (Date.now() > Number(d.expires)) return fail("eExp");
    if (code !== String(d.code)){ if (++tries >= 5){ tries = 0; lockUntil = Date.now() + 30000; } return fail("eWrong"); }
    tries = 0; remove(ref(db, `codes/${uid}`)).catch(() => {});
    try { sessionStorage.setItem("v", uid); } catch {}
    await loadRec(); next();
  } catch (e) { console.error(e); fail("eNet"); }
  finally { busy = false; $("#b-verify").disabled = false; }
}
$("#b-verify").onclick = verify;

/* ── 4: Business connection gate ── */
$("#b-check").onclick = async () => { await checkBiz(); if (!bizOn) toast(t("off")); };
$("#b-connected").onclick = () => bizOn ? next() : toast(t("off"));

/* ── 5: plan ── */
$("#b-free").onclick = async () => {
  const b = $("#b-free"); b.disabled = true;
  try { await tmo(update(ref(db, `users/${uid}`), { plan: "free" })); rec.plan = "free"; next(); }
  catch (e) { console.error(e); toast(t("eNet")); } finally { b.disabled = false; }
};

/* ── Modals: help + profile (edits are a draft until Save) ── */
const open = id => { $(id).classList.add("open"); document.body.classList.add("lock"); };
const closeAll = () => { $$(".modal").forEach(m => m.classList.remove("open")); document.body.classList.remove("lock"); };
$$("[data-close]").forEach(b => b.onclick = closeAll);
$$(".modal").forEach(m => m.addEventListener("click", e => { if (e.target === m) closeAll(); }));
addEventListener("keydown", e => { if (e.key === "Escape") closeAll(); });
$("#b-help").onclick = () => open("#m-help");
let draft = "";
const cnt = () => $("#cnt").textContent = $("#desc").value.length;
$("#av-top").onclick = async () => { draft = rec.avatar; $("#desc").value = rec.description; cnt(); paintMe(); open("#m-prof"); await checkBiz(); };
$("#desc").oninput = cnt;
$("#b-photo").onclick = () => $("#file").click();
$("#file").onchange = e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  const url = URL.createObjectURL(f), img = new Image();
  img.onload = () => {
    const s = 256, c = document.createElement("canvas"); c.width = c.height = s;
    const k = Math.max(s / img.width, s / img.height), w = img.width * k, h = img.height * k;
    c.getContext("2d").drawImage(img, (s - w) / 2, (s - h) / 2, w, h);
    draft = c.toDataURL("image/jpeg", .85); $("#av-big").style.backgroundImage = `url("${draft}")`; $("#av-big").textContent = ""; URL.revokeObjectURL(url);
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast(t("photoErr")); }; img.src = url;
};
$("#b-save").onclick = async () => {
  const b = $("#b-save"), d = $("#desc").value.trim(); b.disabled = true;
  try {
    await tmo(update(ref(db, `users/${uid}`), { description: d, avatar: draft || "", lang }));
    rec.description = d; rec.avatar = draft; $("#m-desc").textContent = d || t("emptyD"); paintMe();
    tg?.HapticFeedback?.notificationOccurred("success"); toast(t("saved")); closeAll();
  } catch (e) { console.error(e); toast(t("eNet")); } finally { b.disabled = false; }
};

/* ═════════ Access: ban + staff roles ═════════ */
const ADMIN_ID = "8515868917";
const isAdmin = uid === ADMIN_ID;
let ban = null, isStaff = isAdmin;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const when = ms => new Date(ms).toLocaleString(lang === "ru" ? "ru-RU" : "en-GB");
const activeBan = b => b && (!b.until || b.until > Date.now());
async function loadAccess(){
  try { const b = (await tmo(get(ref(db, `bans/${uid}`)))).val(); ban = !isAdmin && activeBan(b) ? b : null; } catch {}
  try { isStaff = isAdmin || (await tmo(get(ref(db, `support/${uid}`)))).exists(); } catch {}
}
const MS = { s:1e3, m:6e4, h:36e5, d:864e5, w:6048e5, "с":1e3, "м":6e4, "ч":36e5, "д":864e5, "н":6048e5 };
function parseDur(v){ v = (v || "").trim().toLowerCase(); if (!v) return 0; const m = v.match(/^(\d+)\s*([smhdwсмчдн])$/); return m ? +m[1] * MS[m[2]] : null; }   // 0 = forever, null = invalid
const notify = (to, text) => push(ref(db, "outbox"), { to: String(to), text: String(text).slice(0, 3500) }).catch(() => {});   // delivered by bot.py

/* ── Ban screen with appeal ── */
let banOff = [];
function showBan(){
  $("#ban-reason").textContent = ban.reason || "—";
  $("#ban-until").textContent = ban.until ? when(ban.until) : t("forever");
  show("s-ban"); banOff.forEach(f => f());
  banOff = [
    onValue(ref(db, `appeals/${uid}`), s => {
      const a = s.val();
      $("#ap-st").innerHTML = a ? `<span class="tag ${a.status === "rejected" ? "no" : a.status === "accepted" ? "ok" : ""}">${t("ap_" + a.status)}</span>` : "";
      $("#ap-send").disabled = !!a && a.status === "new";
    }),
    onValue(ref(db, `bans/${uid}`), s => { if (!s.exists() && ban){ ban = null; banOff.forEach(f => f()); toast(t("unbanned")); next(); } })
  ];
}
$("#ap-send").onclick = async () => {
  const text = $("#ap-text").value.trim(); if (text.length < 10) return toast(t("fill"));
  try {
    await tmo(set(ref(db, `appeals/${uid}`), { uid, name: fullName, username: U.username || "", text, status: "new", at: Date.now(), banReason: ban?.reason || "" }));
    notify(ADMIN_ID, `📨 Апелляция от ${fullName} (ID ${uid})\n${text.slice(0, 300)}`); toast(t("sent"));
  } catch (e) { console.error(e); toast(t("eNet")); }
};
let liveBan = false;
function watchBan(){   // kick a user out instantly when banned while the app is open
  if (liveBan || isAdmin) return; liveBan = true;
  onValue(ref(db, `bans/${uid}`), s => { const b = s.val(); if (activeBan(b)){ ban = b; showBan(); } });
}

/* ═════════ App shell ═════════ */
const VIEWS = { home:"v-home", support:"v-support", thread:"v-thread", queue:"v-queue", admin:"v-admin" };
let listUnsub, thUnsub, thId, thData, qTab = "open", tFiles = [];
const closeDrawer = () => { $("#drawer").classList.remove("open"); $("#scrim").classList.remove("open"); };
$("#b-menu").onclick = () => { $("#drawer").classList.add("open"); $("#scrim").classList.add("open"); };
$("#scrim").onclick = closeDrawer;
function nav(v){
  closeDrawer(); listUnsub?.(); listUnsub = null; if (v !== "thread") thUnsub?.();
  $$("#s-main .view").forEach(e => { if (Object.values(VIEWS).includes(e.id)) e.classList.toggle("active", e.id === VIEWS[v]); });
  $$(".nv").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  $("#v-title").textContent = { home:"Mini App", support:t("nSupport"), thread:t("nSupport"), queue:t("nQueue"), admin:t("nAdmin") }[v];
  if (v === "support") renderMine(); if (v === "queue") renderQueue(); if (v === "admin") renderAdmin();
  scrollTo(0, 0);
}
document.addEventListener("click", e => { const n = e.target.closest("[data-nav]"); if (n) nav(n.dataset.nav); });
function buildNav(){
  const it = [["home","🏠",t("nHome")], ["support","💬",t("nSupport")]];
  if (isStaff) it.push(["queue","🎧",t("nQueue")]); if (isAdmin) it.push(["admin","🛡️",t("nAdmin")]);
  it.push(["help","❓",t("help")], ["profile","👤",t("nProfile")]);
  $("#nav").innerHTML = it.map(([v, i, l]) => `<button class="nv" data-v="${v}"><i>${i}</i>${l}</button>`).join("");
  $$(".nv").forEach(b => b.onclick = () => b.dataset.v === "help" ? (closeDrawer(), open("#m-help")) : b.dataset.v === "profile" ? (closeDrawer(), $("#av-top").click()) : nav(b.dataset.v));
}
function enterApp(){ buildNav(); paintMe(); $("#m-desc").textContent = rec.description || t("emptyD"); show("s-main"); nav("home"); watchBan(); }

/* ═════════ Support tickets ═════════ */
const stTag = s => `<span class="tag ${s === "work" ? "ok" : s === "closed" ? "" : "no"}">${t("st_" + s)}</span>`;
const item = (id, x) => `<button class="item" data-id="${id}"><div class="kv"><b>#${id.slice(-5)} · ${esc(x.nick)}</b>${stTag(x.status)}</div><div class="sub clip">${esc(x.text)}</div></button>`;
function fillList(el, rows, empty){ el.innerHTML = rows.map(([i, x]) => item(i, x)).join("") || `<p class="sub">${empty}</p>`; el.querySelectorAll(".item").forEach(b => b.onclick = () => openThread(b.dataset.id)); }
const rowsOf = s => { const r = []; s.forEach(c => { r.push([c.key, c.val()]); }); return r.reverse(); };
const renderMine = () => { listUnsub = onValue(query(ref(db, "tickets"), orderByChild("uid"), equalTo(uid)), s => fillList($("#t-list"), rowsOf(s), t("noT"))); };
const renderQueue = () => { $$("#q-tabs button").forEach(b => b.classList.toggle("on", b.dataset.q === qTab)); listUnsub = onValue(ref(db, "tickets"), s => fillList($("#q-list"), rowsOf(s).filter(([, x]) => x.status === qTab), t("noT"))); };
$$("#q-tabs button").forEach(b => b.onclick = () => { qTab = b.dataset.q; listUnsub?.(); renderQueue(); });

$("#b-newt").onclick = () => { const f = $("#t-form"); f.hidden = !f.hidden; if (!$("#t-nick").value) $("#t-nick").value = U.username ? "@" + U.username : ""; };
$("#t-cancel").onclick = () => { $("#t-form").hidden = true; };
const shrink = f => new Promise((res, rej) => {   // photo -> small JPEG data URL (stored in the database)
  const u = URL.createObjectURL(f), im = new Image();
  im.onload = () => { const k = Math.min(1, 900 / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = im.width * k; c.height = im.height * k; c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg", .72)); };
  im.onerror = rej; im.src = u;
});
const drawPrev = () => { const p = $("#t-prev"); p.innerHTML = tFiles.map((s, i) => `<div class="th"><img src="${s}" alt=""><button data-k="${i}">×</button></div>`).join(""); p.querySelectorAll("button").forEach(b => b.onclick = () => { tFiles.splice(+b.dataset.k, 1); drawPrev(); }); };
$("#t-att").onclick = () => $("#t-file").click();
$("#t-file").onchange = async e => {
  for (const f of [...e.target.files].slice(0, 3 - tFiles.length)) { try { tFiles.push(await shrink(f)); } catch { toast(t("photoErr")); } }
  e.target.value = ""; drawPrev();
};
$("#t-send").onclick = async () => {
  const nick = $("#t-nick").value.trim(), text = $("#t-text").value.trim();
  if (!nick || text.length < 10) return toast(t("fill"));
  const b = $("#t-send"); b.disabled = true;
  try {
    const r = await tmo(push(ref(db, "tickets"), { uid, name: fullName, username: U.username || "", nick, text, files: tFiles, status: "open", at: Date.now() }), 20000);
    const st = (await get(ref(db, "support"))).val() || {};
    [...new Set([ADMIN_ID, ...Object.keys(st)])].forEach(id => notify(id, `🆕 Обращение #${r.key.slice(-5)} от ${nick}\n${text.slice(0, 200)}`));
    tFiles = []; drawPrev(); $("#t-text").value = ""; $("#t-form").hidden = true; toast(t("sent"));
  } catch (e) { console.error(e); toast(t("eNet")); } finally { b.disabled = false; }
};

/* ── Ticket thread (live) ── */
function openThread(id){ nav("thread"); thUnsub?.(); thId = id; thUnsub = onValue(ref(db, `tickets/${id}`), s => { thData = s.val(); drawThread(); }); }
function drawThread(){
  const tk = thData; if (!tk) return;
  const mine = tk.uid === uid, staff = isStaff && !mine, tag = "#" + thId.slice(-5);
  $("#th-head").innerHTML = `<div class="kv"><b>${tag} · ${esc(tk.nick)}</b>${stTag(tk.status)}</div>` + (staff ? `<div class="sub">${esc(tk.name)} · ID ${esc(tk.uid)}</div>` : "") + (tk.agent ? `<div class="sub">🎧 ${esc(tk.agent.name)}</div>` : "");
  const all = [{ from:"user", text:tk.text, at:tk.at, files:tk.files }, ...Object.values(tk.msgs || {}).sort((a, b) => a.at - b.at)];
  $("#th-msgs").innerHTML = all.map(m => `<div class="b ${(mine ? m.from === "user" : m.from === "agent") ? "me" : ""}">${esc(m.text).replace(/\n/g, "<br>")}${(m.files || []).map(f => `<img src="${f}" alt="">`).join("")}<small>${when(m.at)}</small></div>`).join("");
  const mineAgent = tk.agent?.uid === uid || isAdmin;
  $("#th-dock").hidden = !(tk.status !== "closed" && (mine || (tk.status === "work" && mineAgent)));
  const act = $("#th-act"); act.innerHTML = "";
  if (staff && tk.status === "open") act.innerHTML = `<button class="btn" data-a="take">Взять в работу</button>`;
  else if (tk.status !== "closed" && (mine || (staff && mineAgent))) act.innerHTML = `<button class="btn ghost" data-a="close">${t("closeT")}</button>`;
  act.querySelectorAll("button").forEach(b => b.onclick = () => threadAct(b.dataset.a));
  scrollTo(0, document.body.scrollHeight);
}
async function threadAct(a){
  const tk = thData, p = `tickets/${thId}`, tag = "#" + thId.slice(-5);
  try {
    if (a === "take"){ await update(ref(db, p), { status:"work", agent:{ uid, name: fullName } }); notify(tk.uid, `✅ Обращение ${tag} взято в работу: ${fullName}`); }
    if (a === "close"){ await update(ref(db, p), { status:"closed" }); const to = tk.uid !== uid ? tk.uid : tk.agent?.uid; if (to) notify(to, `🔒 Обращение ${tag} закрыто.`); }
  } catch (e) { console.error(e); toast(t("eNet")); }
}
$("#th-send").onclick = async () => {
  const i = $("#th-in"), text = i.value.trim(); if (!text || !thData) return; i.value = "";
  const mine = thData.uid === uid;
  try {
    await push(ref(db, `tickets/${thId}/msgs`), { from: mine ? "user" : "agent", uid, name: fullName, text, at: Date.now() });
    const to = mine ? thData.agent?.uid : thData.uid; if (to) notify(to, `💬 #${thId.slice(-5)} · ${mine ? fullName : "Поддержка"}:\n${text.slice(0, 500)}`);
  } catch (e) { console.error(e); toast(t("eNet")); }
};
$("#th-in").onkeydown = e => { if (e.key === "Enter") $("#th-send").click(); };

/* ═════════ Admin panel (ID 8515868917) ═════════ */
function renderAdmin(){
  const bind = (el, fn) => el.querySelectorAll("[data-act]").forEach(b => b.onclick = () => fn(b.dataset.act, b.dataset.id));
  const empty = txt => `<p class="sub">${txt}</p>`;
  const offs = [
    onValue(ref(db, "support"), s => {
      const o = s.val() || {};
      $("#a-slist").innerHTML = Object.entries(o).map(([id, x]) => `<div class="item"><div class="kv"><span>${esc(x.name || "—")} · <code>${id}</code></span><button class="btn ghost sm" data-act="rm" data-id="${id}">Снять</button></div></div>`).join("") || empty("Пока никого");
      bind($("#a-slist"), (a, id) => remove(ref(db, `support/${id}`)).then(() => notify(id, "Роль поддержки снята.")));
    }),
    onValue(ref(db, "bans"), s => {
      const o = s.val() || {};
      $("#a-blist").innerHTML = Object.entries(o).map(([id, x]) => `<div class="item"><div class="kv"><span><code>${id}</code> · ${x.until ? when(x.until) : "навсегда"}</span><button class="btn ghost sm" data-act="un" data-id="${id}">Разбанить</button></div><div class="sub">${esc(x.reason || "без причины")}</div></div>`).join("") || empty("Банлист пуст");
      bind($("#a-blist"), (a, id) => remove(ref(db, `bans/${id}`)).then(() => notify(id, "✅ Вы разблокированы.")));
    }),
    onValue(ref(db, "appeals"), s => {
      const rows = Object.entries(s.val() || {}).filter(([, x]) => x.status === "new");
      $("#a-ap").innerHTML = rows.map(([id, x]) => `<div class="item"><b>${esc(x.name)} · <code>${id}</code></b><div class="sub">Бан: ${esc(x.banReason || "—")}</div><div>${esc(x.text)}</div><div class="row" style="margin-top:6px"><button class="btn sm" data-act="ok" data-id="${id}">Принять</button><button class="btn ghost sm" data-act="no" data-id="${id}">Отклонить</button></div></div>`).join("") || empty("Новых апелляций нет");
      bind($("#a-ap"), async (a, id) => {
        if (a === "ok"){ await remove(ref(db, `bans/${id}`)); await update(ref(db, `appeals/${id}`), { status:"accepted" }); notify(id, "✅ Апелляция принята, бан снят."); }
        else { await update(ref(db, `appeals/${id}`), { status:"rejected" }); notify(id, "❌ Апелляция отклонена."); }
      });
    })
  ];
  listUnsub = () => offs.forEach(f => f());
}
const idOk = v => /^\d{5,15}$/.test(v);
$("#a-sadd").onclick = async () => {
  const id = $("#a-sid").value.trim(); if (!idOk(id)) return toast("Неверный ID");
  let name = ""; try { name = (await get(ref(db, `users/${id}/name`))).val() || ""; } catch {}
  await set(ref(db, `support/${id}`), { name, at: Date.now() }); notify(id, "🎧 Вам выдана роль поддержки. Откройте приложение → Обращения.");
  $("#a-sid").value = ""; toast(t("saved"));
};
$("#a-bban").onclick = async () => {
  const id = $("#a-bid").value.trim(), d = parseDur($("#a-bt").value), reason = $("#a-br").value.trim();
  if (!idOk(id) || d === null) return toast("Проверьте ID и время (30m, 2h, 7d)");
  if (id === ADMIN_ID) return toast("Нельзя");
  const until = d ? Date.now() + d : 0;
  await set(ref(db, `bans/${id}`), { reason, until, at: Date.now(), by: uid });
  notify(id, `⛔ Вы заблокированы ${until ? "до " + when(until) : "навсегда"}.\nПричина: ${reason || "не указана"}\nОбжаловать: мини-приложение → Апелляция.`);
  ["#a-bid", "#a-bt", "#a-br"].forEach(s => $(s).value = ""); toast(t("saved"));
};

applyLang(); paintMe();
</script>
</body>
</html>
