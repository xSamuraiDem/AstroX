<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0a0305" />
<title>AstroX</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* ============================================================ RESET / TOKENS */
:root{
  --bg:#080204;
  --bg2:#120509;
  --red:#c1121f;
  --red2:#ff2e4d;
  --rose:#ff7a8f;
  --ember:#7a0a16;
  --deep:#3d0410;
  --text:#f8ecf0;
  --muted:#b6929b;
  --dim:#6f525b;
  --line:rgba(255,90,110,.16);
  --line-strong:rgba(255,90,110,.34);
  --glass:rgba(255,255,255,.05);
  --glass2:rgba(255,255,255,.02);
  --glow:0 14px 44px rgba(255,46,77,.28);
  --glow-strong:0 0 0 1px rgba(255,46,77,.4), 0 18px 44px rgba(255,46,77,.4);
  --r:24px;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--text);
  background:
    radial-gradient(1100px 620px at 50% -12%, rgba(193,18,31,.42), transparent 62%),
    radial-gradient(700px 480px at 108% 108%, rgba(122,10,22,.35), transparent 60%),
    radial-gradient(500px 400px at -10% 70%, rgba(255,46,77,.1), transparent 60%),
    var(--bg);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.95}
#app{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column}

h1,h2,h3,.display{font-family:Unbounded,Manrope,sans-serif;letter-spacing:-.015em;margin:0}
h1{font-size:26px;font-weight:800;line-height:1.15}
h2{font-size:20px;font-weight:700}
p{margin:0;line-height:1.55}
.muted{color:var(--muted)}
.small{font-size:13px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}

/* ============================================================ TOPBAR */
#topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(14px + var(--sat)) 20px 10px;
  position:relative;z-index:3;
}
#topbar[hidden]{display:none}
.logo{display:flex;align-items:center;gap:11px}
.logo .mark{
  width:36px;height:36px;border-radius:13px;display:grid;place-items:center;position:relative;
  background:linear-gradient(140deg,#ff2e4d,#8a0d1a);
  box-shadow:0 8px 22px rgba(255,46,77,.42), inset 0 1px 0 rgba(255,255,255,.2);
}
.logo .mark::after{
  content:"";position:absolute;inset:-7px;border-radius:50%;
  border:1.5px solid rgba(255,122,143,.35);
  border-right-color:transparent;border-left-color:transparent;
  animation:spin 6s linear infinite;
}
.logo .mark svg{width:20px;height:20px;filter:drop-shadow(0 0 6px rgba(255,255,255,.6))}
.logo .word{font-family:Unbounded;font-weight:800;font-size:17px;letter-spacing:.02em}
.logo .word b{
  background:linear-gradient(90deg,#ff2e4d,#ff8fa3);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.avatar-btn{
  width:44px;height:44px;border-radius:50%;padding:2px;
  background:linear-gradient(140deg,#ff2e4d,#5a0810);
  box-shadow:0 8px 22px rgba(255,46,77,.35);
  transition:transform .18s, box-shadow .22s;
}
.avatar-btn:active{transform:scale(.92)}
.avatar{
  width:100%;height:100%;border-radius:50%;object-fit:cover;
  background:#1f0a0f;display:grid;place-items:center;
  font-family:Unbounded;font-weight:700;color:#fff;
  border:2px solid var(--bg);
}
.avatar.lg{font-size:32px}

/* ============================================================ SCREENS */
#screens{flex:1;display:flex;flex-direction:column}
.screen{
  display:none;flex:1;flex-direction:column;
  padding:calc(22px + var(--sat)) 20px calc(28px + var(--sab));
  max-width:540px;width:100%;margin:0 auto;
}
.screen.active{display:flex;animation:rise .45s cubic-bezier(.2,.75,.2,1)}
.has-top .screen.active{padding-top:10px}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,46,77,.55)}70%{box-shadow:0 0 0 12px rgba(255,46,77,0)}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.shake{animation:shake .5s}

/* ============================================================ HERO */
.hero{margin:6px 0 22px}
.hero .eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--rose);margin-bottom:14px;
}
.hero .eyebrow::before{
  content:"";width:22px;height:2px;
  background:linear-gradient(90deg,#ff2e4d,transparent);
  border-radius:2px;
}
.hero p{margin-top:10px;color:var(--muted);font-size:15px;line-height:1.55}

/* ============================================================ STEPS */
.steps{display:flex;gap:6px;margin-bottom:20px}
.steps i{
  flex:1;height:3px;border-radius:3px;
  background:rgba(255,255,255,.08);position:relative;overflow:hidden;
  transition:background .3s;
}
.steps i.done{background:rgba(255,46,77,.55)}
.steps i.cur{background:linear-gradient(90deg,#ff2e4d,#ff8fa3);box-shadow:0 0 14px rgba(255,46,77,.6)}

/* ============================================================ CARD */
.card{
  background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:22px;
  backdrop-filter:blur(18px) saturate(140%);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  box-shadow:0 26px 64px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
  position:relative;overflow:hidden;
}
.card + .card{margin-top:14px}
.card::before{
  content:"";position:absolute;inset:0 0 auto 0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,122,143,.5),transparent);
}

/* ============================================================ BTN */
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:16px 18px;border-radius:16px;
  font-weight:700;font-size:15px;letter-spacing:.01em;
  transition:transform .15s, opacity .2s, box-shadow .2s;
  position:relative;overflow:hidden;
}
.btn:active{transform:scale(.975)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.primary{
  color:#fff;
  background:linear-gradient(135deg,#ff2e4d 0%,#c1121f 55%,#8a0d1a 100%);
  box-shadow:var(--glow);
}
.btn.primary::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);
  transform:translateX(-120%);transition:transform .6s;
}
.btn.primary:hover::after{transform:translateX(120%)}
.btn.ghost{
  background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--text);
}
.btn.ghost:hover{background:rgba(255,255,255,.08);border-color:var(--line-strong)}
.btn.link{padding:10px;color:var(--rose);font-weight:600;font-size:14px}
.row{display:flex;gap:10px}
.mt{margin-top:14px}.mt2{margin-top:22px}
.spinner{
  width:18px;height:18px;border-radius:50%;
  border:2.5px solid rgba(255,255,255,.25);border-top-color:#fff;
  animation:spin .8s linear infinite;display:inline-block;
}

/* ============================================================ CAPTCHA */
.check{
  display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;
  background:rgba(0,0,0,.25);border:1px solid var(--line);
  cursor:pointer;user-select:none;transition:border-color .2s, background .2s;
}
.check:hover{border-color:var(--line-strong);background:rgba(0,0,0,.32)}
.box{
  width:32px;height:32px;border-radius:10px;
  border:2px solid rgba(255,122,143,.5);
  display:grid;place-items:center;flex:none;transition:all .25s;
  background:rgba(255,46,77,.06);
}
.check.loading .box{border-color:transparent;background:none}
.check.loading .box::after{
  content:"";width:22px;height:22px;border-radius:50%;
  border:2.5px solid rgba(255,122,143,.25);border-top-color:#ff2e4d;
  animation:spin .7s linear infinite;
}
.check.ok .box{background:linear-gradient(135deg,#ff2e4d,#b3101f);border-color:transparent}
.check.ok .box svg{display:block;animation:pop .35s}
.box svg{display:none;width:16px;height:16px}
.check .lbl{font-weight:700;flex:1;font-size:15px}
.check .brand{
  font-family:Unbounded;font-size:10px;font-weight:700;
  letter-spacing:.16em;color:var(--dim);
}
.challenge{margin-top:16px}
.cap{display:flex;gap:10px;align-items:center}
.cap canvas{
  width:100%;max-width:260px;height:88px;border-radius:16px;
  border:1px solid var(--line);display:block;
  box-shadow:inset 0 0 30px rgba(255,46,77,.08);
}
.iconbtn{
  width:46px;height:46px;border-radius:14px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);
  display:grid;place-items:center;flex:none;transition:transform .3s, background .2s;
}
.iconbtn:hover{background:rgba(255,255,255,.09)}
.iconbtn:active{transform:rotate(180deg) scale(.95)}
.iconbtn svg{width:18px;height:18px}
.field{
  width:100%;padding:15px 16px;border-radius:14px;
  background:rgba(0,0,0,.3);border:1px solid var(--line);
  outline:none;font-size:16px;letter-spacing:.32em;
  text-transform:uppercase;text-align:center;font-weight:800;
  transition:border-color .2s, box-shadow .2s;
  font-family:Unbounded;
}
.field::placeholder{letter-spacing:.32em;color:var(--dim)}
.field:focus{border-color:#ff2e4d;box-shadow:0 0 0 4px rgba(255,46,77,.15)}
.hint{min-height:20px;margin-top:10px;font-size:13px;color:var(--muted);text-align:center;transition:color .2s;font-weight:600}
.hint.err{color:#ff6b7f}
.hint.ok{color:#7ee2a1}

/* ============================================================ OTP */
.otp{display:flex;gap:8px;justify-content:center;margin:20px 0 8px}
.otp input{
  width:46px;height:60px;border-radius:14px;text-align:center;
  font-size:26px;font-weight:700;font-family:Unbounded;
  background:rgba(0,0,0,.32);border:1px solid var(--line);outline:none;
  caret-color:#ff2e4d;
  transition:border-color .2s, box-shadow .2s, transform .15s;
}
.otp input:focus{
  border-color:#ff2e4d;box-shadow:0 0 0 4px rgba(255,46,77,.15);
  transform:translateY(-2px);
}
.otp input.filled{border-color:rgba(255,122,143,.45)}
.otp.ok input{border-color:#4fd389;box-shadow:0 0 0 4px rgba(79,211,137,.15)}
.chat-tip{
  display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;
  background:rgba(255,46,77,.08);border:1px dashed rgba(255,122,143,.35);
}
.chat-tip .dot{
  width:10px;height:10px;border-radius:50%;background:#ff2e4d;
  animation:pulse 1.8s infinite;flex:none;
}

/* ============================================================ CHOICE */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{
  padding:24px 18px;border-radius:22px;
  background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  border:1px solid var(--line);text-align:left;
  position:relative;overflow:hidden;
  transition:transform .15s, border-color .2s, box-shadow .2s;
}
.choice:active{transform:scale(.97)}
.choice.sel{border-color:#ff2e4d;box-shadow:0 0 0 1px #ff2e4d inset, var(--glow)}
.choice .big{
  font-family:Unbounded;font-size:36px;font-weight:800;
  background:linear-gradient(90deg,#fff,#ffb3c0);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  line-height:1;
}
.choice .sub{margin-top:10px;color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.02em}
.choice .corner{
  position:absolute;right:-26px;top:-26px;width:90px;height:90px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,46,77,.35),transparent 70%);
}

/* ============================================================ PLANS */
.plan{
  padding:22px;border-radius:22px;border:1px solid var(--line);
  background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  position:relative;overflow:hidden;text-align:left;width:100%;
  transition:transform .15s, border-color .2s, box-shadow .2s;
}
.plan + .plan{margin-top:12px}
.plan.sel{border-color:#ff2e4d;box-shadow:0 0 0 1px #ff2e4d inset, var(--glow)}
.plan.dev{opacity:.75}
.plan .head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.plan .name{font-family:Unbounded;font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.plan .price{font-family:Unbounded;font-size:14px;color:var(--rose)}
.plan ul{
  margin:16px 0 0;padding:0;list-style:none;display:grid;gap:9px;
}
.plan li{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted);line-height:1.4}
.plan li svg{width:16px;height:16px;flex:none;color:var(--rose)}
.badge{
  display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:rgba(255,46,77,.14);color:var(--rose);
  border:1px solid rgba(255,122,143,.3);
}
.badge.ok{background:rgba(79,211,137,.12);color:#7ee2a1;border-color:rgba(79,211,137,.3)}
.badge.wait{background:rgba(255,255,255,.06);color:var(--muted);border-color:var(--line)}

/* ============================================================ BUSINESS */
.list{display:grid;gap:10px;margin-top:16px}
.list .it{
  display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:14px;
  background:rgba(0,0,0,.22);border:1px solid var(--line);
  font-size:14px;line-height:1.5;
}
.list .n{
  width:28px;height:28px;border-radius:9px;flex:none;display:grid;place-items:center;
  font-family:Unbounded;font-size:12px;font-weight:800;
  background:linear-gradient(135deg,#ff2e4d,#8a0d1a);
  box-shadow:0 4px 12px rgba(255,46,77,.35);
}
.status-pill{
  display:inline-flex;align-items:center;gap:10px;padding:10px 14px;border-radius:999px;
  background:rgba(0,0,0,.3);border:1px solid var(--line);
  font-size:13px;font-weight:700;
}
.status-pill .dot{width:9px;height:9px;border-radius:50%;background:#ff2e4d;animation:pulse 1.6s infinite}
.status-pill.ok .dot{background:#4fd389;animation:none}

/* ============================================================ HOME */
.welcome{display:flex;align-items:center;gap:16px}
.welcome .avatar-btn{width:64px;height:64px}
.welcome h2{font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.tiles{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;
}
.tile{
  padding:18px 16px;border-radius:20px;
  background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  border:1px solid var(--line);text-align:left;
  display:flex;flex-direction:column;gap:12px;
  transition:transform .15s, border-color .2s;
}
.tile:active{transform:scale(.97)}
.tile:hover{border-color:var(--line-strong)}
.tile .ic{
  width:42px;height:42px;border-radius:14px;display:grid;place-items:center;
  background:rgba(255,46,77,.14);color:var(--rose);
}
.tile .ic svg{width:20px;height:20px}
.tile b{font-size:15px;font-weight:700}
.tile span{font-size:12px;color:var(--muted);line-height:1.4}
.stat{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 0;border-top:1px solid rgba(255,255,255,.06);
}
.stat:first-child{border-top:0;padding-top:0}
.stat .k{color:var(--muted);font-size:13px;font-weight:600}
.stat .v{font-weight:700;font-size:14px}
.orbit{
  position:absolute;right:-50px;top:-50px;width:160px;height:160px;border-radius:50%;
  border:1px solid rgba(255,122,143,.18);pointer-events:none;
}
.orbit::after{
  content:"";position:absolute;width:8px;height:8px;border-radius:50%;
  background:#ff2e4d;top:50%;left:-4px;box-shadow:0 0 14px #ff2e4d;
  animation:orbit 7s linear infinite;transform-origin:84px 0;
}
@keyframes orbit{to{transform:rotate(360deg)}}

/* ============================================================ PROFILE */
.pf-head{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:8px}
.pf-ava{position:relative;width:110px;height:110px}
.pf-ava .avatar-btn{width:110px;height:110px;padding:3px}
.pf-ava .cam{
  position:absolute;right:-2px;bottom:-2px;width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,#ff2e4d,#8a0d1a);
  display:grid;place-items:center;border:3px solid var(--bg);
  box-shadow:var(--glow);transition:transform .2s;
}
.pf-ava .cam:active{transform:scale(.92)}
.pf-ava .cam svg{width:16px;height:16px}
label.lab{
  display:block;font-size:11px;font-weight:800;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim);margin:18px 0 8px;
}
.inp{
  width:100%;padding:14px 16px;border-radius:14px;
  background:rgba(0,0,0,.3);border:1px solid var(--line);
  outline:none;font-size:15px;
  transition:border-color .2s, box-shadow .2s;resize:none;
}
.inp:focus{border-color:#ff2e4d;box-shadow:0 0 0 4px rgba(255,46,77,.15)}
.counter{text-align:right;font-size:11px;color:var(--dim);margin-top:6px;font-weight:600}
.seg{
  display:flex;padding:4px;border-radius:14px;
  background:rgba(0,0,0,.3);border:1px solid var(--line);
}
.seg button{
  flex:1;padding:11px;border-radius:11px;font-weight:700;font-size:13px;
  color:var(--muted);transition:all .2s;
}
.seg button.on{
  background:linear-gradient(135deg,#ff2e4d,#b3101f);color:#fff;
  box-shadow:0 8px 20px rgba(255,46,77,.32);
}

/* ============================================================ SPLASH */
.splash{align-items:center;justify-content:center;text-align:center}
.splash .mark{
  width:92px;height:92px;border-radius:28px;
  background:linear-gradient(140deg,#ff2e4d,#8a0d1a);
  display:grid;place-items:center;box-shadow:var(--glow);
  position:relative;margin-bottom:24px;
}
.splash .mark svg{width:50px;height:50px;filter:drop-shadow(0 0 10px rgba(255,255,255,.55))}
.splash .mark::after{
  content:"";position:absolute;inset:-16px;border-radius:50%;
  border:1.5px solid rgba(255,122,143,.35);
  border-right-color:transparent;border-left-color:transparent;
  animation:spin 5s linear infinite;
}
.splash h1{font-size:36px;letter-spacing:.02em}
.splash h1 b{
  background:linear-gradient(90deg,#ff2e4d,#ff8fa3);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}

/* ============================================================ MISC */
.banner{
  position:sticky;top:0;z-index:5;margin:0 0 12px;padding:10px 14px;border-radius:12px;
  background:rgba(255,46,77,.14);border:1px solid rgba(255,122,143,.35);
  font-size:12px;font-weight:700;color:var(--rose);text-align:center;
}
#toast{
  position:fixed;left:50%;bottom:calc(24px + var(--sab));
  transform:translate(-50%,20px);opacity:0;z-index:50;
  padding:12px 18px;border-radius:14px;
  background:rgba(30,8,12,.94);border:1px solid var(--line);
  backdrop-filter:blur(12px);font-size:14px;font-weight:600;
  max-width:90vw;text-align:center;transition:all .3s;
  pointer-events:none;box-shadow:0 16px 40px rgba(0,0,0,.55);
}
#toast.show{opacity:1;transform:translate(-50%,0)}
.check-ok{
  width:76px;height:76px;border-radius:50%;margin:12px auto;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#4fd389,#1f8a4c);
  box-shadow:0 14px 44px rgba(79,211,137,.4);
  animation:pop .5s;
}
.check-ok svg{width:36px;height:36px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="app">
  <header id="topbar" hidden>
    <div class="logo">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none">

const tgUser = tg?.initDataUnsafe?.user || null;
const DEMO = !tgUser;
const me = tgUser || { id:0, first_name:"Guest", username:"", language_code:(navigator.language||"en").startsWith("ru")?"ru":"en" };
const uid = String(me.id);
const LS_KEY = "astrox:" + uid;

let lang = (me.language_code||"").startsWith("ru") ? "ru" : "en";
let rec = null, meta = {}, current = "splash", booted = false, pending = null;
let captchaCode = "", captchaFails = 0, captchaLockUntil = 0, resendTimer = null;

if (tg) {

};
const t = (k,p={}) => ((I18N[lang]||I18N.en)[k] ?? I18N.en[k] ?? k).replace(/\{(\w+)\}/g,(_,n)=>p[n] ?? "");
const fmtDate = (ms) => ms ? new Date(ms).toLocaleDateString(lang==="ru"?"ru-RU":"en-GB",{day:"2-digit",month:"short",year:"numeric"}) : "—";
const planName = (p) => p==="go" ? t("plan_go") : p==="free" ? t("plan_free") : "—";
const userRef = () => ref(db, "users/" + uid);

let toastTimer;
function toast(msg){
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"), 2600);
}

function applyI18n(){

const enter = {
  captcha(){ resetCaptcha(); },
  code(){ $("#codeIdle").hidden=false; $("#codeEntry").hidden=true; $("#codeDone").hidden=true; },
  lang(){ selectedLang = rec?.lang || lang;
    $$("[data-lang].choice").forEach(b => b.classList.toggle("sel", b.dataset.lang===selectedLang)); },
  plan(){},
  business(){ $("#bizPill").classList.toggle("ok", !!rec?.business_connected); },
  home(){ renderUser(); },

function showScreen(name){

  current = name;
  $$(".screen").forEach(s => s.classList.toggle("active", s.dataset.screen===name));
  const top = ["home","profile"].includes(name);
  $("#topbar").hidden = !top;

try { tg?.BackButton?.onClick(() => showScreen("home")); } catch {}

function captchaFresh(){
  const ts = +sessionStorage.getItem("astrox:captcha:"+uid) || 0;
  return Date.now() - ts < CFG.captchaTtlMin*60*1000;
}
function resolveStep(r){
  if (!r?.verified) return captchaFresh() ? "code" : "captcha";
  if (!r.lang_chosen) return "lang";
  if (!r.plan) return "plan";
  const requireBiz = meta.require_business !== false;
  if (requireBiz && !r.business_connected) return "business";
  return "home";
}
function route(){ showScreen(resolveStep(rec)); }

/* ============================================================ DATA */
function cacheRec(v){
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      verified:v.verified, lang:v.lang, lang_chosen:v.lang_chosen, plan:v.plan,
      business_connected:v.business_connected, profile:v.profile||{},
      created_at:v.created_at, username:v.username, first_name:v.first_name,
    }));
  } catch {}
}
function handleRecord(v){
  const prev = rec;
  rec = v;
  if (!v){ booted=true; showScreen("nostart"); return; }
  cacheRec(v);
  if (v.lang && v.lang!==lang){ lang=v.lang; applyI18n(); }
  if (pending && v.auth && v.auth.nonce===pending.nonce) onAuthResult(v.auth);
  if (prev && current==="business" && v.business_connected){
    haptic("success"); toast(t("biz_done")); route(); return;
  }
  if (prev && current==="home" && meta.require_business!==false && !v.business_connected && prev.business_connected){
    route(); return;
  }
  if (!booted){ booted=true; route(); }
  else if (["home","profile"].includes(current)) renderUser();
}
async function saveUser(patch){
  if (DEMO){
    rec = { ...(rec||{}), ...patch };
    if (patch.profile) rec.profile = { ...(rec.profile||{}), ...patch.profile };
    handleRecord({ ...rec }); return;
  }
  await update(userRef(), patch);
}
async function sendCommand(kind, extra={}){
  const nonce = crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random().toString(16).slice(2);
  clearTimeout(pending?.timer);
  pending = { nonce, kind, timer:setTimeout(()=>onAuthResult({nonce,status:"timeout"}), CFG.botTimeoutMs) };
  await push(ref(db, "inbox/"+uid), { type:kind, nonce, initData:tg?.initData||"", ts:Date.now(), ...extra });
  return nonce;
}

/* ============================================================ CAPTCHA */
const CH = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const rnd = (a,b) => a + Math.random()*(b-a);
function drawCaptcha(){
  captchaCode = Array.from({length:CFG.captchaLen}, () => CH[Math.floor(Math.random()*CH.length)]).join("");
  const c = $("#capCanvas"), dpr = window.devicePixelRatio||1, W=260, H=84;
  c.width = W*dpr; c.height = H*dpr;
  const x = c.getContext("2d");
  x.setTransform(dpr,0,0,dpr,0,0);
  const g = x.createLinearGradient(0,0,W,H);
  g.addColorStop(0,"#1a070b"); g.addColorStop(1,"#2a0a12");
  x.fillStyle = g; x.fillRect(0,0,W,H);
  for (let i=0;i<7;i++){
    x.strokeStyle = `rgba(255,${(60+rnd(0,90))|0},${(80+rnd(0,80))|0},${rnd(.18,.45)})`;
    x.lineWidth = rnd(1,2.2);
    x.beginPath();
    x.moveTo(rnd(-10,W), rnd(0,H));
    x.bezierCurveTo(rnd(0,W),rnd(-20,H+20),rnd(0,W),rnd(-20,H+20),rnd(0,W+10),rnd(0,H));
    x.stroke();
  }
  const colors = ["#ffe9ec","#ff4d6d","#ff8fa3","#f7c2c9","#ffffff"];
  [...captchaCode].forEach((ch,i) => {
    x.save();
    x.translate(34 + i*46 + rnd(-4,4), 52 + rnd(-7,7));
    x.rotate(rnd(-.4,.4));
    x.font = `800 ${(34+rnd(0,8))|0}px Unbounded, Manrope, sans-serif`;
    x.textAlign = "center"; x.textBaseline = "middle";
    x.shadowColor = "rgba(255,46,77,.6)"; x.shadowBlur = 10;
    x.fillStyle = colors[Math.floor(rnd(0,colors.length))];
    x.fillText(ch,0,0);
    x.restore();
  });
  for (let i=0;i<70;i++){
    x.fillStyle = `rgba(255,255,255,${rnd(.08,.35)})`;
    x.beginPath(); x.arc(rnd(0,W),rnd(0,H),rnd(.6,1.8),0,7); x.fill();
  }
  $("#capInput").value = "";
  setHint("#capHint","");
}
function setHint(sel,msg,cls=""){
  const el = $(sel); el.textContent = msg; el.className = "hint "+cls;
}
function resetCaptcha(){
  const chk = $("#capCheck");
  chk.className = "check"; chk.setAttribute("aria-checked","false");
  $("#capChallenge").hidden = true;
}
$("#capCheck").addEventListener("click", startCaptcha);
$("#capCheck").addEventListener("keydown", e => { if (e.key==="Enter"||e.key===" ") startCaptcha(); });
function startCaptcha(){
  const chk = $("#capCheck");
  if (chk.classList.contains("loading")||chk.classList.contains("ok")) return;
  haptic("light");
  chk.classList.add("loading");
  setTimeout(() => {
    chk.classList.remove("loading");
    $("#capChallenge").hidden = false;
    drawCaptcha();
    setTimeout(()=>$("#capInput").focus(), 100);
  }, 900 + Math.random()*500);
}
$("#capRefresh").addEventListener("click", () => { haptic("light"); drawCaptcha(); });
$("#capInput").addEventListener("keydown", e => { if (e.key==="Enter") verifyCaptcha(); });
$("#capSubmit").addEventListener("click", verifyCaptcha);
function verifyCaptcha(){
  const now = Date.now();
  if (now < captchaLockUntil){
    setHint("#capHint", t("captcha_wait",{s:Math.ceil((captchaLockUntil-now)/1000)}), "err");
    return;
  }
  const v = $("#capInput").value.trim().toUpperCase();
  if (v.length !== CFG.captchaLen || v !== captchaCode){
    captchaFails++; haptic("error");
    $("#capInput").classList.add("shake");
    setTimeout(()=>$("#capInput").classList.remove("shake"), 500);
    setHint("#capHint", t("captcha_wrong"), "err");
    if (captchaFails % 3 === 0) captchaLockUntil = now + 10000;
    drawCaptcha();
    setHint("#capHint", t("captcha_wrong"), "err");
    return;
  }
  haptic("success");
  const chk = $("#capCheck");
  chk.classList.add("ok"); chk.setAttribute("aria-checked","true");
  setHint("#capHint", t("captcha_ok"), "ok");
  sessionStorage.setItem("astrox:captcha:"+uid, String(Date.now()));
  setTimeout(()=>showScreen("code"), 700);
}

/* ============================================================ CODE */
const otpInputs = $$("#otp input");
otpInputs.forEach((inp,i) => {
  inp.addEventListener("input", () => {
    inp.value = inp.value.replace(/\D/g,"").slice(-1);
    inp.classList.toggle("filled", !!inp.value);
    if (inp.value && i<5) otpInputs[i+1].focus();
    maybeSubmitCode();
  });
  inp.addEventListener("keydown", e => {
    if (e.key==="Backspace" && !inp.value && i>0){
      otpInputs[i-1].value = ""; otpInputs[i-1].classList.remove("filled");
      otpInputs[i-1].focus();
    }
  });
  inp.addEventListener("paste", e => {
    const txt = (e.clipboardData.getData("text")||"").replace(/\D/g,"").slice(0,6);
    if (!txt) return;
    e.preventDefault();
    [...txt].forEach((d,j) => { otpInputs[j].value = d; otpInputs[j].classList.add("filled"); });
    otpInputs[Math.min(txt.length,5)].focus();
    maybeSubmitCode();
  });
});
const otpValue = () => otpInputs.map(i=>i.value).join("");
function clearOtp(focus=true){
  otpInputs.forEach(i => { i.value=""; i.classList.remove("filled"); });
  $("#otp").classList.remove("ok");
  if (focus) otpInputs[0].focus();
}
function lockOtp(l){ otpInputs.forEach(i => i.disabled = l); }

$("#codeRequest").addEventListener("click", requestCode);
$("#codeResend").addEventListener("click", requestCode);
async function requestCode(){
  haptic("medium");
  $("#codeIdle").hidden = true;
  $("#codeEntry").hidden = false;
  $("#codeSentTxt").textContent = t("code_sending");
  setHint("#codeHint","");
  clearOtp(false);
  lockOtp(true);
  startResend(CFG.resendSec);
  if (DEMO){
    setTimeout(() => {
      $("#codeSentTxt").textContent = t("code_sent");
      toast(t("demo_code"));
      lockOtp(false); otpInputs[0].focus();
    }, 700);
    return;
  }
  try { await sendCommand("request_code"); }
  catch(e){ console.error(e); setHint("#codeHint", t("error"), "err"); lockOtp(false); }
}
function startResend(sec){
  clearInterval(resendTimer);
  const btn = $("#codeResend");
  let left = sec;
  const tick = () => {
    if (left <= 0){ clearInterval(resendTimer); btn.disabled = false; btn.textContent = t("code_resend_now"); }
    else { btn.disabled = true; btn.textContent = t("code_resend",{s:left}); left--; }
  };
  tick(); resendTimer = setInterval(tick, 1000);
}
async function maybeSubmitCode(){
  const code = otpValue();
  if (code.length!==6 || pending?.kind==="verify_code") return;
  haptic("light");
  lockOtp(true);
  setHint("#codeHint", t("code_checking"));
  if (DEMO){
    setTimeout(() => {
      if (code === CFG.demoCode) onAuthResult({nonce:"demo",status:"ok"}, true);
      else onAuthResult({nonce:"demo",status:"wrong",attempts_left:4}, true);
    }, 600);
    return;
  }
  try { await sendCommand("verify_code",{code}); }
  catch(e){ console.error(e); setHint("#codeHint", t("error"), "err"); lockOtp(false); }
}
function onAuthResult(a, force=false){
  if (!force && (!pending || a.nonce!==pending.nonce)) return;
  clearTimeout(pending?.timer);
  const kind = pending?.kind;
  pending = null;
  const S = a.status;
  if (S==="sent"){ $("#codeSentTxt").textContent = t("code_sent"); lockOtp(false); otpInputs[0].focus(); return; }
  if (S==="ok"){
    haptic("success");
    $("#otp").classList.add("ok");
    setHint("#codeHint", t("code_ok"), "ok");
    if (DEMO) rec = { ...(rec||{}), verified:true };
    setTimeout(()=>{ $("#codeEntry").hidden = true; $("#codeDone").hidden = false; }, 350);
    setTimeout(()=>route(), 1400);
    return;
  }
  const map = {
    wrong:()=>t("code_wrong",{n:a.attempts_left??0}),
    expired:()=>t("code_expired"),
    locked:()=>t("code_locked"),
    cooldown:()=>t("code_cooldown",{s:a.retry_in??60}),
    limit:()=>t("code_limit"),
    timeout:()=>t("code_timeout"),
    bad_auth:()=>t("code_bad_auth"),
    blocked:()=>t("code_blocked"),
    too_new:()=>t("code_too_new"),
  };
  haptic("error");
  setHint("#codeHint", (map[S]||(()=>t("error")))(), "err");
  if (S==="cooldown") startResend(a.retry_in??60);
  if (kind==="request_code" && S!=="cooldown"){ $("#codeSentTxt").textContent = t("code_sub"); }
  if (S==="wrong"){ $("#otp").classList.add("shake"); setTimeout(()=>$("#otp").classList.remove("shake"), 500); }
  lockOtp(false);
  clearOtp(S==="wrong");
}

function resizeImage(file, size){
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = c.height = size;
      const x = c.getContext("2d");
      const s = Math.min(img.width, img.height);
      x.drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = rej;
    img.src = url;
  });
}

  if (a==="home") showScreen("home");
  if (a==="goto-lang") showScreen("profile");
  if (a==="goto-plan") toast(planName(rec?.plan) + " · " + t("plan_soon"));
});
$("#topAvatar").addEventListener("click", () => {
  haptic("light");
  showScreen(current==="profile" ? "home" : "profile");
});

/* ============================================================ STARS */
(() => {
  const c = $("#stars"), x = c.getContext("2d");
  let W,H,stars = [];
  const resize = () => {
    const d = Math.min(window.devicePixelRatio||1, 2);
    W = c.width = innerWidth * d;
    H = c.height = innerHeight * d;
    stars = Array.from({length: Math.min(160, ((innerWidth*innerHeight)/5000)|0)}, () => ({
      x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*1.4*d + 0.3,
      p: Math.random()*6.28, s: 0.4 + Math.random()*0.8,
      v: (0.02 + Math.random()*0.05)*d,
    }));
  };
  resize();
  addEventListener("resize", resize);
  const loop = (ts) => {
    x.clearRect(0,0,W,H);
    for (const s of stars){
      const a = 0.35 + 0.55 * Math.sin((ts/900)*s.s + s.p);
      x.fillStyle = `rgba(255,${(200+40*a)|0},${(210+30*a)|0},${a})`;
      x.beginPath(); x.arc(s.x, s.y, s.r, 0, 6.28); x.fill();
      s.y -= s.v;
      if (s.y < -2){ s.y = H+2; s.x = Math.random()*W; }
    }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
})();

/* ============================================================ BOOT */
async function boot(){
  applyI18n();
  showScreen("splash");
  try { if (db) meta = (await get(ref(db,"meta/bot"))).val() || {}; } catch(e){ console.warn("meta", e); }
  applyI18n();
  if (DEMO){
    const b = document.createElement("div");
    b.className = "banner";
    b.textContent = t("demo_banner");
    $("#app").prepend(b);
    rec = { verified:false, lang, lang_chosen:false, plan:null, business_connected:false, profile:{}, created_at:Date.now() };
    booted = true;
    const want = new URLSearchParams(location.search).get("screen");
    if (want && enter[want]){
      rec = { ...rec, verified:true, lang_chosen:true, plan:"free", business_connected: want==="home"||want==="profile" };
      showScreen(want);
      return;
    }
    route();
    return;
  }
  try {
    const cached = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    if (cached){ rec = cached; if (cached.lang){ lang = cached.lang; applyI18n(); } }
  } catch {}
  if (!db){ showScreen("nostart"); return; }
  onValue(userRef(), snap => handleRecord(snap.val()), err => {
    console.error(err); toast(t("error"));
    if (!booted){ booted = true; route(); }
  });
}
boot();
</script>
